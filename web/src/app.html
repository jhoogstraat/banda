<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The mode and theme from Settings (mode-watcher's keys), before the app loads so light doesn't flash dark. Dark by
			// default: stored here, as mode-watcher stores "system" on load and its defaultMode needs server rendering.
			const mode = localStorage.getItem('mode-watcher-mode') ?? 'dark';
			localStorage.setItem('mode-watcher-mode', mode);
			if (mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches))
				document.documentElement.classList.remove('dark');
			const theme = localStorage.getItem('mode-watcher-theme');
			if (theme) document.documentElement.dataset.theme = theme;
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
