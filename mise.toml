[tools]
go = "1.27"
node = "26"
pnpm = "latest"
buf = "latest"
kind = "latest"
kubectl = "latest"
podman = "6"
jq = "latest"
helm = "4"
actionlint = "latest"
# Code generators for `mise run gen`, local so parallel checkouts don't hit buf's remote plugin rate limit.
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
"go:connectrpc.com/connect/v2/cmd/protoc-gen-connect-go" = "2.0.1"
"npm:@bufbuild/protoc-gen-es" = "2.16.0"

[env]
# Podman, not Docker: kind creates its node in the shared default machine, through its root connection.
# For Docker, set KIND_EXPERIMENTAL_PROVIDER, CONTAINER=docker and
# RUNNER_API_URL=http://host.docker.internal:8787 under [env] in mise.local.toml.
KIND_EXPERIMENTAL_PROVIDER = "podman"
CONTAINER_CONNECTION = "podman-machine-default-root"

# The tasks take settings from the environment, e.g. `PUBLIC_HOST=192.168.0.30 mise run api`:
#   PUBLIC_HOST    address browsers use (default localhost). Not localhost: web listens on all interfaces.
#   SANDBOX_IMAGE  sandbox image (default localhost/banda-sandbox:dev), TARGET its Dockerfile stage (default sandbox)
#   DEV_AUTH=1     API skips sign-in and trusts the X-Banda-User header. Otherwise it signs in against Dex.

[tasks.up]
description = "Start the local stack: Podman machine, kind cluster, Dex, web and API (PUBLIC_HOST, default: LAN address)"
run = "deploy/dev.sh up"

[tasks.e2e]
description = "End-to-end suite (web/e2e, Playwright) with the fake agent, in a namespace and database of its own; args go to Playwright"
run = "deploy/dev.sh e2e"

[tasks.down]
description = "Stop the API, web and the kind node (the shared Podman machine keeps running)"
run = "deploy/dev.sh down"

[tasks.clean]
description = "Dev only: delete sandboxes (and volumes) of threads untouched for CLEAN_HOURS (default 24)"
run = "deploy/dev.sh clean"

[tasks.test]
description = "Go unit tests"
run = "go test ./..."

[tasks.gen]
description = "Generate code from proto/ into gen/"
run = "buf generate"

[tasks.cluster]
description = "Create the kind cluster with agent-sandbox, Postgres and Dex"
run = """
kind get clusters | grep -qx banda || kind create cluster --config deploy/kind.yaml
kubectl --context kind-banda apply -f https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.8/sandbox.yaml
# Each volume takes a helper pod; 4 workers (the default) can't keep up with parallel e2e runs. Nor can
# the provisioner's 5 requests a second (it polls each helper pod): a thread's volumes took 25 s, not 3.
for f in --worker-threads=16 --kube-client-qps=50 --kube-client-burst=100; do
  kubectl --context kind-banda -n local-path-storage get deploy local-path-provisioner -o jsonpath='{.spec.template.spec.containers[0].command}' | grep -q -- "${f%=*}" ||
    kubectl --context kind-banda -n local-path-storage patch deploy local-path-provisioner --type json -p "[{\\"op\\":\\"add\\",\\"path\\":\\"/spec/template/spec/containers/0/command/-\\",\\"value\\":\\"$f\\"}]"
done
mise run dex
"""

[tasks.dex]
description = "Install the chart in kind without the API: Postgres, the sandbox policies and Dex with its issuer on PUBLIC_HOST (browsers reach it through the web server at /dex)"
run = 'deploy/dev.sh chart --set api.enabled=false --set publicUrl=http://${PUBLIC_HOST:-localhost}:5173'


[tasks.image]
description = "Build the sandbox image and load it into kind (after changing cmd/runner or deploy/sandbox.Dockerfile)"
run = """
i=${SANDBOX_IMAGE:-localhost/banda-sandbox:dev}
c=${CONTAINER:-podman}
# E2E_IMAGE is built already (CI): only load it.
[ "$i" = "${E2E_IMAGE:-}" ] || $c build -f deploy/sandbox.Dockerfile --target "${TARGET:-sandbox}" -t "$i" .
# Loading is the slow part: skip it when the node already has this build.
$c exec banda-control-plane crictl inspecti -q "$i" 2>/dev/null | grep -q "$($c image inspect "$i" | jq -r '.[0].Id')" && exit
# Its own archive: checkouts build their images side by side.
t=$(mktemp -u /tmp/banda-sandbox.XXXXXX).tar
$c save "$i" -o "$t"
kind load image-archive "$t" --name banda
rm -f "$t"
"""

[tasks.api]
description = "Run the Go API on :8787 (ADDR)"
run = """
h=${PUBLIC_HOST:-localhost}
[ -n "${DEV_AUTH:-}" ] || export \
  OIDC_ISSUER=${OIDC_ISSUER:-http://$h:5173/dex} \
  OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-banda} \
  OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-banda-dev-secret} \
  PUBLIC_URL=${PUBLIC_URL:-http://$h:5173} \
  SESSION_SECRET=${SESSION_SECRET:-banda-local-dev-session-secret}
export RUNNER_API_URL=${RUNNER_API_URL:-http://host.containers.internal:8787}
export SANDBOX_IMAGE=${SANDBOX_IMAGE:-localhost/banda-sandbox:dev}
exec go run ./cmd/api
"""

[tasks.web]
description = "Run the Vite dev server on :5173"
run = '''exec pnpm -C web dev $([ "${PUBLIC_HOST:-localhost}" = localhost ] || echo --host)'''

[tasks.deploy]
description = "Build the API image (with the web build), load it into kind and install the chart with the API, signing in with Dex at PUBLIC_URL/dex (default http://localhost:8787)"
run = """
${CONTAINER:-podman} build -f deploy/api.Dockerfile -t localhost/banda-api:dev .
${CONTAINER:-podman} save localhost/banda-api:dev -o /tmp/banda-api.tar
kind load image-archive /tmp/banda-api.tar --name banda
deploy/dev.sh chart --set api.enabled=true --set publicUrl=${PUBLIC_URL:-http://localhost:8787}
kubectl --context kind-banda rollout restart -n banda deployment/banda-api
kubectl --context kind-banda rollout status -n banda deployment/banda-api --timeout=300s
# Both would sweep and drive the same threads; mise run up removes this one again.
! lsof -tiTCP:8787 -sTCP:LISTEN >/dev/null || echo 'An API runs on this machine too (mise run api): stop it, one API per database.' >&2
echo 'kubectl --context kind-banda -n banda port-forward svc/banda-api 8787 8788, then open http://localhost:8787'
"""

[tasks.chart-check]
description = "Lint the Helm chart and render it with every values file and Kustomize overlay"
run = """
set -e
helm lint deploy/helm/banda
helm lint deploy/helm/banda -f deploy/kustomize/kind/values.yaml
helm template banda deploy/helm/banda -n banda --set dex.enabled=true,ingress.enabled=true,ingress.host=banda.example.com,ingress.previewHost=preview.banda.example.com,ingress.tlsSecret=tls >/dev/null
helm template banda deploy/helm/banda -n banda --set monitoring.serviceMonitor.enabled=true,monitoring.prometheusRule.enabled=true | grep -q 'kind: PrometheusRule'
for k in base kind example; do kubectl kustomize --enable-helm deploy/kustomize/$k >/dev/null; done
"""

[tasks.contract]
description = "Contract tests (cmd/runner/contract_test.go): the runner against the real pinned claude in the sandbox image, offline, against a fake Messages API; args go to the test binary"
run = """
set -e
c=${CONTAINER:-podman}
i=${CONTRACT_IMAGE:-localhost/banda-sandbox:contract}
# CONTRACT_IMAGE is built already (CI).
[ -n "${CONTRACT_IMAGE:-}" ] || $c build -q -f deploy/sandbox.Dockerfile --target sandbox -t "$i" . >/dev/null
d=$(mktemp -d)
trap 'rm -rf "$d"' EXIT
CGO_ENABLED=0 GOOS=linux GOARCH=$($c image inspect "$i" | jq -r '.[0].Architecture') go test -c -tags contract -o "$d/runner.test" ./cmd/runner
# No network: claude reaches only the fake API inside the container. No login: a throwaway key, an empty config dir.
$c run --rm --network none -e BANDA_CONTRACT=1 -v "$d:/contract:ro" --entrypoint /contract/runner.test "$i" -test.run Contract -test.v "$@"
"""
