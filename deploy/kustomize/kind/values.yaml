# Local dev in kind: images loaded by `mise run image` and `mise run deploy`,
# Postgres on localhost:5432 and Dex on localhost:5556 (deploy/kind.yaml's
# port mappings), fixed dev secrets. Also the values of `mise run dex`,
# `mise run deploy` and the e2e world (deploy/dev.sh).
image:
  api: {repository: localhost/banda-api, tag: dev}
  sandbox: {repository: localhost/banda-sandbox, tag: dev}
  login: {repository: localhost/banda-sandbox, tag: dev} # the sandbox image runs login environments too
sandboxes:
  prepull: false # images are loaded into the node, not pulled
sessionSecret: banda-local-dev-session-secret
oidc:
  clientSecret: banda-dev-secret
postgres:
  password: banda
  apiPassword: banda
  nodePort: 30432
  backup: {enabled: false}
dex:
  enabled: true
  nodePort: 30556
  # Sign in as alice, bob or carol (@example.com) with the password "password".
  users:
