{{- if .Values.postgres.enabled }}
{{- /* nil after helm upgrade --reuse-values from a chart without backups */}}
{{- $backup := .Values.postgres.backup | default dict }}
# One Postgres: the superuser banda, the API's role banda_api (made by the API's
# init container, api.yaml) and nightly dumps (below). ponytail: no failover or
# point-in-time recovery; CloudNativePG or a managed database when that matters.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: banda}
            # Only read when the volume is new. ponytail: a password set in values (dev) stays in the pod
            # spec, as kind clusters made before the chart have it, so adopting them doesn't restart Postgres
            # under other checkouts' e2e runs; a generated one only in the Secret.
            {{- if .Values.postgres.password }}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }}}
            {{- else }}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "banda.postgresSecret" . }}, key: POSTGRES_PASSWORD}}
            {{- end }}
            - {name: POSTGRES_DB, value: banda}
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, banda]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            {{- if $backup.enabled }}
            # The dumps, to restore from here. Also binds the volume on install, which helm --wait needs
            # with a WaitForFirstConsumer storage class.
            - {name: backup, mountPath: /backup, readOnly: true}
            {{- end }}
      {{- if $backup.enabled }}
      volumes:
        - name: backup
          persistentVolumeClaim: {claimName: postgres-backup}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  type: {{ ternary "NodePort" "ClusterIP" (not (empty .Values.postgres.nodePort)) }}
  selector: {app: postgres}
  ports:
    - port: 5432
      {{- with .Values.postgres.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
# Only the API and the backups reach Postgres: in the cluster, or from outside
# it through the NodePort (dev). No other pod does, not even through the NodePort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: banda-api}}
        - ipBlock: {cidr: 0.0.0.0/0, except: [{{ .Values.podCIDR }}]}
        - podSelector: {matchLabels: {app: postgres-backup}}
      ports:
        - port: 5432
{{- with $backup }}
{{- if .enabled }}
---
# Kept on uninstall: it's what's left if the data volume goes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  labels: {{- include "banda.labels" $ | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .storage }}
---
# A custom-format dump of the database banda as its owner banda_api, then the
# newest `keep` dumps stay. Restore: docs/deployment.md, "Backups".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels: {{- include "banda.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app: postgres-backup}
        spec:
          restartPolicy: Never
          # The volume is ReadWriteOnce and Postgres has it mounted: the same node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: {matchLabels: {app: postgres}}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: {{ $.Values.postgres.image }}
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGUSER, value: banda_api}
                - {name: PGDATABASE, value: banda}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ include "banda.secret" $ }}, key: POSTGRES_API_PASSWORD}}
                - {name: KEEP, value: {{ .keep | quote }}}
              command: [bash, -ec]
              args:
                - |
                  rm -f /backup/*.part
                  f=/backup/banda-$(date -u +%Y%m%dT%H%M%SZ).dump
                  pg_dump -Fc -f "$f.part"
                  mv "$f.part" "$f"
                  ls -1t /backup/banda-*.dump | tail -n +$((KEEP + 1)) | xargs -r rm --
                  ls -l /backup
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              persistentVolumeClaim: {claimName: postgres-backup}
{{- end }}
{{- end }}
{{- end }}
