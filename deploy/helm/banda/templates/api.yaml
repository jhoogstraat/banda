{{- if .Values.api.enabled }}
# Without OIDC (oidc.issuer or dex.enabled) the API refuses to start unless api.devAuth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banda-api
  labels: {{- include "banda.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banda-api
  labels: {{- include "banda.labels" . | nindent 4 }}
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, create, patch] # list: /metrics counts them
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets] # users' banda-env-* and banda-auth-*, the team's banda-env-team, banda-git, runner tokens (<sandbox>-token, owned by their Sandbox)
    verbs: [get, list, create, patch, delete] # list, delete: the start-up sweep of token Secrets from before they had an owner
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies] # sandboxes-allow, from SANDBOX_EGRESS_ALLOW
    verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banda-api
  labels: {{- include "banda.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banda-api
subjects:
  - kind: ServiceAccount
    name: banda-api
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banda-api
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  # One API per database: events fan out in memory (PLAN.md, "Not yet"), so a
  # rollout stops the old pod before it starts the new one.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: banda-api}
  template:
    metadata:
      labels: {app: banda-api}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: banda-api
      {{- if .Values.postgres.enabled }}
      initContainers:
        # As the superuser, on every start: the API's role banda_api with the password in its Secret,
        # owning the database banda and what an API connected as the superuser made there before it.
        # Not a superuser, can't create roles or databases. The API itself never sees the superuser's password.
        - name: postgres-role
          image: {{ .Values.postgres.image }}
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGUSER, value: banda}
            - {name: PGDATABASE, value: banda}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "banda.postgresSecret" . }}, key: POSTGRES_PASSWORD}}
            - name: API_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "banda.secret" . }}, key: POSTGRES_API_PASSWORD}}
          command: [bash, -ec]
          args:
            - |
              until pg_isready -q; do sleep 2; done
              psql -q -v ON_ERROR_STOP=1 -v pw="$API_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE banda_api' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'banda_api') \gexec
              ALTER ROLE banda_api LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
              ALTER DATABASE banda OWNER TO banda_api;
              DO $role$ DECLARE o text; BEGIN
                FOR o IN SELECT format('ALTER TABLE %s OWNER TO banda_api', oid::regclass) FROM pg_class
                  WHERE relnamespace = 'public'::regnamespace AND relkind IN ('r', 'p') AND relowner <> 'banda_api'::regrole
                UNION ALL SELECT format('ALTER ROUTINE %s OWNER TO banda_api', oid::regprocedure) FROM pg_proc
                  WHERE pronamespace = 'public'::regnamespace AND proowner <> 'banda_api'::regrole
                LOOP EXECUTE o; END LOOP;
              END $role$;
              SQL
      {{- end }}
      containers:
        - name: api
          image: {{ include "banda.image" (dict "image" .Values.image.api "root" .) }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - {name: api, containerPort: 8787}
            - {name: preview, containerPort: 8788} # the Browser tab's origin
            {{- with .Values.api.metricsPort }}
            - {name: metrics, containerPort: {{ . }}} # /metrics, for a Prometheus in the cluster; no ingress routes it
            {{- end }}
          env:
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_API_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "banda.secret" . }}, key: POSTGRES_API_PASSWORD}}
            - {name: DATABASE_URL, value: "postgres://banda_api:$(POSTGRES_API_PASSWORD)@postgres:5432/banda"}
            {{- end }}
            - {name: SANDBOX_NAMESPACE, value: {{ .Release.Namespace }}}
            - {name: SANDBOX_IMAGE, value: {{ include "banda.image" (dict "image" .Values.image.sandbox "root" .) | quote }}}
            - {name: RUNNER_API_URL, value: "http://banda-api.{{ .Release.Namespace }}.svc:8787"}
            - {name: PUBLIC_URL, value: {{ include "banda.publicUrl" . | quote }}}
            {{- with .Values.api.metricsPort }}
            - {name: METRICS_ADDR, value: ":{{ . }}"}
            {{- end }}
            {{- with include "banda.previewUrl" . }}
            - {name: PREVIEW_URL, value: {{ . | quote }}}
            {{- end }}
            {{- with include "banda.issuer" . }}
            - {name: OIDC_ISSUER, value: {{ . | quote }}}
            - {name: OIDC_CLIENT_ID, value: {{ $.Values.oidc.clientId | quote }}}
            {{- with $.Values.oidc.providerName }}
            - {name: OIDC_PROVIDER_NAME, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- if and .Values.dex.enabled (not .Values.oidc.issuer) }}
            - {name: DEX_URL, value: "http://dex.{{ .Release.Namespace }}.svc:5556"}
            {{- end }}
            {{- if .Values.api.devAuth }}
            - {name: DEV_AUTH, value: "1"}
            {{- end }}
            {{- with .Values.egressAllow }}
            - {name: SANDBOX_EGRESS_ALLOW, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.sandboxes }}
            - {name: SANDBOX_CPU, value: {{ .cpu | toString | quote }}}
            - {name: SANDBOX_MEMORY, value: {{ .memory | quote }}}
            - {name: SANDBOX_SCRATCH, value: {{ .scratch | quote }}}
            - {name: SANDBOX_HOME_SIZE, value: {{ .homeSize | quote }}}
            - {name: CLAUDE_VOLUME_SIZE, value: {{ .claudeVolumeSize | quote }}}
            - {name: LOGIN_CPU, value: {{ .login.cpu | toString | quote }}}
            - {name: LOGIN_MEMORY, value: {{ .login.memory | quote }}}
            - {name: LOGIN_SCRATCH, value: {{ .login.scratch | quote }}}
            {{- end }}
            {{- range $k, $v := .Values.api.env }}
            - {name: {{ $k }}, value: {{ $v | toString | quote }}}
            {{- end }}
          envFrom:
            - secretRef: {name: {{ include "banda.secret" . }}}
          readinessProbe:
            httpGet: {path: /, port: api}
          livenessProbe:
            httpGet: {path: /, port: api}
            periodSeconds: 20
            failureThreshold: 3
          {{- with .Values.api.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: banda-api
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  selector: {app: banda-api}
  ports:
    - {name: api, port: 8787, targetPort: api}
    - {name: preview, port: 8788, targetPort: preview}
    {{- with .Values.api.metricsPort }}
    - {name: metrics, port: {{ . }}, targetPort: metrics}
    {{- end }}
{{- end }}
