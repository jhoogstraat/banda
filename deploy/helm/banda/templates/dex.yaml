{{- if .Values.dex.enabled }}
{{- $public := include "banda.publicUrl" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  labels: {{- include "banda.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Browsers reach Dex at the API's /dex (DEX_URL), in dev at the web server's.
    issuer: {{ $public }}/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    # Banda's look (files/dex): the templates that differ from the image's, and the theme.
    # A dir, as Dex otherwise serves the copy built into its binary.
    frontend:
      dir: /srv/dex/web
      issuer: Banda
      theme: banda
    oauth2:
      skipApprovalScreen: true
    enablePasswordDB: true
    staticClients:
      - id: {{ .Values.oidc.clientId }}
        secretEnv: OIDC_CLIENT_SECRET
        name: Banda
        redirectURIs: [{{ $public }}/auth/callback]
    staticPasswords: {{- toYaml .Values.dex.users | nindent 6 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-web
  labels: {{- include "banda.labels" . | nindent 4 }}
data: {{- (.Files.Glob "files/dex/*.{html,css}").AsConfig | nindent 2 }}
binaryData:
  inter.woff2: {{ .Files.Get "files/dex/inter.woff2" | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dex}
  template:
    metadata:
      labels: {app: dex}
      annotations:
        checksum/config: {{ list .Values.dex .Values.oidc.clientId $public (include (print $.Template.BasePath "/secret.yaml") .) (.Files.Glob "files/dex/*") | toJson | sha256sum }}
    spec:
      containers:
        - name: dex
          image: {{ .Values.dex.image }}
          args: [dex, serve, /etc/dex/config.yaml]
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "banda.secret" . }}, key: OIDC_CLIENT_SECRET}}
          ports:
            - containerPort: 5556
          readinessProbe:
            httpGet: {path: /dex/healthz, port: 5556}
          volumeMounts:
            - {name: config, mountPath: /etc/dex}
            - {name: theme, mountPath: /srv/dex/web/themes/banda}
            {{- range $path, $_ := .Files.Glob "files/dex/*.html" }}
            - {name: web, mountPath: /srv/dex/web/templates/{{ base $path }}, subPath: {{ base $path }}}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: dex}
        - name: web
          configMap: {name: dex-web}
        - name: theme
          configMap: {name: dex-web, items: [{key: styles.css, path: styles.css}, {key: inter.woff2, path: inter.woff2}]}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  type: {{ ternary "NodePort" "ClusterIP" (not (empty .Values.dex.nodePort)) }}
  selector: {app: dex}
  ports:
    - port: 5556
      {{- with .Values.dex.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
# Like Postgres's: the API and browsers (through the API's proxy, a NodePort
# or a port-forward) reach Dex, sandboxes don't, even when an allowed range
# (SANDBOX_EGRESS_ALLOW) covers it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex
  labels: {{- include "banda.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app: dex}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: banda-api}}
        - ipBlock: {cidr: 0.0.0.0/0, except: [{{ .Values.podCIDR }}]}
      ports:
        - port: 5556
{{- end }}
