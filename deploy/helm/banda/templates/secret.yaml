{{- if not .Values.api.existingSecret }}
{{- /* Generated values survive upgrades through lookup. helm template (and Kustomize) can't look up, so it
generates new ones on every render: set them there, or use api.existingSecret. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace "banda-api").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: banda-api
  labels: {{- include "banda.labels" . | nindent 4 }}
data:
  SESSION_SECRET: {{ .Values.sessionSecret | b64enc | default (get $old "SESSION_SECRET") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- if include "banda.issuer" . }}
  {{- if and (not .Values.dex.enabled) (not .Values.oidc.clientSecret) }}{{ fail "oidc.clientSecret is required with oidc.issuer" }}{{ end }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | b64enc | default (get $old "OIDC_CLIENT_SECRET") | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | default (get $old "POSTGRES_PASSWORD") | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
  {{- range $k, $v := .Values.api.secretEnv }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
