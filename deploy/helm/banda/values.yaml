# Banda in one namespace: the API, its sandboxes, and optionally Postgres and Dex.
# Needs the agent-sandbox controller (docs/deployment.md, "Install") and a CNI that
# enforces NetworkPolicy. Every API setting is in docs/configuration.md.

# Where browsers reach Banda. Empty: https://<ingress.host> (http without
# ingress.tlsSecret), or http://localhost:8787 without an ingress (port-forward).
# Dex's issuer and the OIDC redirect URI derive from it.
publicUrl: ""
# The Browser tab's origin (PREVIEW_URL). Empty: <scheme>://<ingress.previewHost>,
# or without one the host browsers reach Banda on, port 8788.
previewUrl: ""
# The cluster's pod network. Ingress policies tell sandboxes (pods) from
# browsers (ingress controllers, port-forwards, NodePorts) by it. kind's default.
podCIDR: 10.244.0.0/16

image:
  api:
    repository: ghcr.io/jhoogstraat/banda-api
    tag: "" # default: the chart's appVersion
    pullPolicy: IfNotPresent
  sandbox:
    repository: ghcr.io/jhoogstraat/banda-sandbox
    tag: ""

api:
  enabled: true
  # Settings from a Secret of your own instead of the one this chart makes
  # (banda-api). It needs SESSION_SECRET, OIDC_CLIENT_SECRET (with OIDC or
  # Dex), POSTGRES_PASSWORD and POSTGRES_API_PASSWORD (with the bundled
  # Postgres) or DATABASE_URL (without it), and can hold any other setting.
  existingSecret: ""
  # Plain settings, e.g. {IDLE_SUSPEND_AFTER: 1h, MAX_AGENT_THREADS: "4"}.
  env: {}
  # Secret settings for the Secret this chart makes, e.g. {DATABASE_URL: ...}.
  secretEnv: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
  # Trusts the X-Banda-User header instead of signing in: local experiments only.
  devAuth: false
  # Prometheus metrics at :<metricsPort>/metrics (METRICS_ADDR), on the banda-api
  # Service's port "metrics" for a scraper in the cluster; never on the ingress,
  # unreachable from sandboxes. null turns it off.
  metricsPort: 9090

oidc:
  # Your provider's issuer. Empty with dex.enabled: <publicUrl>/dex.
  issuer: ""
  clientId: banda
  # Empty: generated on install and kept on upgrades (for Dex), else required.
  clientSecret: ""
  # The sign-in page's "Sign in with <providerName>". Empty: SSO.
  providerName: ""

# Signs session cookies. Empty: generated on install and kept on upgrades.
sessionSecret: ""

# SANDBOX_EGRESS_ALLOW: comma-separated CIDRs sandboxes may reach besides the internet.
egressAllow: ""

# What each environment may take (Kubernetes quantities, SANDBOX_CPU and the
# rest in docs/configuration.md). Limits apply from each pod's next start,
# volume sizes to volumes created after the change.
sandboxes:
  cpu: "4"
  memory: 8Gi
  scratch: 10Gi # disk outside the volumes (ephemeral storage)
  homeSize: 10Gi # each thread's volume: the checkout and its home directory
  claudeVolumeSize: 1Gi # each user's Claude Code config, shared by their environments
  login: {cpu: "1", memory: 1Gi, scratch: 1Gi} # each user's login environment
  # Labels a node needs to run environments (SANDBOX_NODE_SELECTOR), e.g.
  # {kubernetes.io/hostname: node-1}. Empty: any node.
  nodeSelector: {}

ingress:
  enabled: false
  className: ""
  # Thread streams stay open for hours. The API sends a keepalive on each every
  # 25 s, so any read timeout above that keeps them, ingress-nginx's default 60 s too.
  annotations:
    # Its default 1m refuses what Banda takes: 5 MB attachments, 64 MB preview requests.
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    # A previewed app's own WebSockets have no keepalive of Banda's.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: "" # banda.example.com
  previewHost: "" # preview.banda.example.com: a sibling of host, for the preview's SameSite cookie
  # A TLS Secret covering both hosts (e.g. from cert-manager). Banda wants https outside a trusted LAN.
  tlsSecret: ""

postgres:
  # false: point DATABASE_URL at your own database (api.secretEnv or api.existingSecret).
  enabled: true
  image: postgres:18
  storage: 5Gi
  # The superuser banda's, which only the API's init container and you
  # (kubectl exec) use. Empty: generated on install and kept on upgrades.
  password: ""
  # The API's role banda_api, which owns the database banda but is no superuser.
  # Empty: generated on install and kept on upgrades. Must be URL-safe.
  apiPassword: ""
  # pg_dump of the database banda to the volume postgres-backup, kept on uninstall.
  backup:
    enabled: true
    schedule: "0 3 * * *"
    keep: 7 # dumps, newest first
    storage: 5Gi
  # Dev only: a NodePort for an API outside the cluster.
  nodePort: null

# For the Prometheus operator's CRDs (kube-prometheus-stack). Add the labels its
# Prometheus selects, e.g. {release: kube-prometheus-stack}: without them it
# silently skips both.
monitoring:
  # Scrapes the API's /metrics (api.metricsPort).
  serviceMonitor: {enabled: false, labels: {}}
  # Alerts BandaInternalErrors (banda_internal_errors_total rose in 10 min) and
  # BandaVolumeFull (a thread's, a user's Claude or Postgres's volume above
  # volumeFull for 15 min, from the kubelet's kubelet_volume_stats_*).
  prometheusRule: {enabled: false, labels: {}, volumeFull: 0.9}

# Dex, a small OIDC provider with static users, for demos and dev. The API
# serves it at <publicUrl>/dex (DEX_URL), so it needs no host of its own.
dex:
  enabled: false
  image: ghcr.io/dexidp/dex:v2.46.0
  nodePort: null
  # email, username, userID and hash (bcrypt: htpasswd -nbBC 10 "" <password> | cut -d: -f2).
  users: []
