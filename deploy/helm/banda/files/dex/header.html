<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{{ issuer }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url .ReqPath "static/main.css" }}" rel="stylesheet">
    <link href="{{ url .ReqPath "theme/styles.css" }}" rel="stylesheet">
    <script>
      // The web app's theme (Settings, stored by mode-watcher): Dex is served on its origin at /dex, so it reads the same key.
      var mode = localStorage.getItem('mode-watcher-mode') || 'dark';
      if (mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('light');
    </script>
  </head>

  <body class="theme-body">
    <div class="dex-container">
      <h1 class="theme-wordmark">{{ issuer }}</h1>
