kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: banda
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30432
        hostPort: 5432
        listenAddress: 127.0.0.1
      - containerPort: 30556
        hostPort: 5556
        listenAddress: 127.0.0.1
kubeadmConfigPatches:
  # A fork bomb in one sandbox can't take the node's PIDs from the others.
  - |
    kind: KubeletConfiguration
    podPidsLimit: 4096
  # A dev cluster: etcd skips fsync, so API writes don't wait on slow disks (CI runners').
  - |
    kind: ClusterConfiguration
    etcd:
      local:
        extraArgs:
          - name: unsafe-no-fsync
            value: "true"
