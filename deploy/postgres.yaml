apiVersion: v1
kind: Namespace
metadata:
  name: banda
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: banda
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: banda
            - name: POSTGRES_PASSWORD
              value: banda
            - name: POSTGRES_DB
              value: banda
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, banda]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banda
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      nodePort: 30432
