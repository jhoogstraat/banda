apiVersion: v1
kind: Namespace
metadata:
  name: banda
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: banda
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: banda
            - name: POSTGRES_PASSWORD
              value: banda
            - name: POSTGRES_DB
              value: banda
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, banda]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banda
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      nodePort: 30432
---
# Only the API reaches Postgres: in the cluster (deploy/banda.yaml), or on
# this machine through the NodePort (from Podman's network, not a pod). No
# other pod does, not even through the NodePort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: banda
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: banda-api}}
        - ipBlock: {cidr: 0.0.0.0/0, except: [10.244.0.0/16]} # kind's pod network
      ports:
        - port: 5432
