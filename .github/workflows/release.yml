# On a tag v1.2.3: images ghcr.io/<owner>/banda-api and banda-sandbox (amd64 and arm64, tags 1.2.3,
# 1.2 and latest), the chart at oci://ghcr.io/<owner>/charts/banda, and a GitHub release with the
# rendered manifest banda.yaml.
name: release
on:
  push:
    tags: ['v*']
permissions: {}
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Each platform on a runner of its own: the sandbox image runs its installers, which emulation slows down.
  image:
    strategy:
      matrix:
        image: [api, sandbox]
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          target: ${{ matrix.image == 'sandbox' && 'sandbox' || '' }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/banda-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
      - run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: digests/*

  # One multi-arch tag set per image from the platforms' digests.
  manifest:
    needs: image
    strategy:
      matrix:
        image: [api, sandbox]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/banda-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - working-directory: digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
        env:
          IMAGE: ${{ env.REGISTRY }}/banda-${{ matrix.image }}

  release:
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      MISE_DISABLE_TOOLS: podman
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: helm
      - name: chart
        run: |
          v=${GITHUB_REF_NAME#v}
          helm package deploy/helm/banda --version "$v" --app-version "$v"
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm push "banda-$v.tgz" "oci://$REGISTRY/charts"
          # What the Kustomize base renders: settings from the Secret banda-api, nothing generated.
          helm template banda "banda-$v.tgz" -n banda -f deploy/kustomize/base/values.yaml >banda.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag banda.yaml banda-*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
