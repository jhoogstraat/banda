name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Podman is the macOS dev setup's; Actions has Docker.
  MISE_DISABLE_TOOLS: podman

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm -C web install --frozen-lockfile
      - run: go vet ./...
      - run: mise run test
      - run: pnpm -C web check
      - run: node web/src/lib/events.check.ts
      - run: node web/src/lib/inbox.check.ts
      - run: buf lint
      - name: generated code is up to date
        run: |
          mise run gen
          git add -A && git diff --cached --exit-code --stat
      - run: mise run chart-check
      - run: actionlint

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, sandbox]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          target: ${{ matrix.image == 'sandbox' && 'sandbox' || '' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # deploy/dev.sh e2e on kind with Docker: the API runs on the runner, sandboxes reach it at the
  # gateway of kind's network (host_ip in deploy/dev.sh).
  e2e:
    runs-on: ubuntu-24.04
    # Playwright's apt dependencies alone took 10 minutes once; the suite takes about 30. The steps have their own
    # limits, below the job's, so a slow run still prints what ran and uploads its artifacts.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      # The images, kind's copy of them and ~200 tests' sandboxes fill the runner's disk: drop toolchains it never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: jdx/mise-action@v5
      - name: Docker instead of Podman
        run: |
          cat >mise.local.toml <<'EOF'
          [env]
          KIND_EXPERIMENTAL_PROVIDER = "docker"
          CONTAINER = "docker"
          EOF
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium
        timeout-minutes: 15
      # The runner's memory and biggest processes every 15 s, into the artifact: the 8 GB runner swapped once
      # (leaked browser tabs) and stalled the kind API server for minutes.
      - run: |
          mkdir -p /tmp/banda-e2e-usage
          (while sleep 15; do date -u +%T; free -m | sed 1d; ps -eo rss=,pcpu=,args= --sort=-rss | head -10 | cut -c1-160; done) >/tmp/banda-e2e-usage/log 2>&1 &
      - run: mise run e2e
        timeout-minutes: 50
        env:
          E2E_WORKERS: "2"
      - if: always()
        run: df -h /
      - if: failure() || cancelled()
        run: |
          sudo dmesg -T | tail -200 >/tmp/banda-e2e-usage/dmesg
          kind export logs /tmp/banda-e2e-kind --name banda
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            /tmp/banda-e2e-*/
            web/playwright-report/
