name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Podman is the macOS dev setup's; Actions has Docker.
  MISE_DISABLE_TOOLS: podman

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm -C web install --frozen-lockfile
      - run: go vet ./...
      - run: mise run test
      - run: pnpm -C web check
      - run: node web/src/lib/events.check.ts
      - run: node web/src/lib/inbox.check.ts
      - run: buf lint
      - name: generated code is up to date
        run: |
          mise run gen
          git add -A && git diff --cached --exit-code --stat
      - run: mise run chart-check
      - run: actionlint

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, sandbox]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          target: ${{ matrix.image == 'sandbox' && 'sandbox' || '' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # deploy/dev.sh e2e on kind with Docker: the API runs on the runner, sandboxes reach it at the
  # gateway of kind's network (host_ip in deploy/dev.sh).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The images, kind's copy of them and ~200 tests' sandboxes fill the runner's disk: drop toolchains it never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: jdx/mise-action@v5
      - name: Docker instead of Podman
        run: |
          cat >mise.local.toml <<'EOF'
          [env]
          KIND_EXPERIMENTAL_PROVIDER = "docker"
          CONTAINER = "docker"
          EOF
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: mise run e2e
        env:
          E2E_WORKERS: "2"
      - if: always()
        run: df -h /
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            /tmp/banda-e2e-*/
            web/playwright-report/
