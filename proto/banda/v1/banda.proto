}

message WatchThreadResponse {
  // Unset: a keepalive.
  Event event = 1;
}

// Runner -> API.
message ConnectRequest {
  oneof kind {
    // First message on every connection.
    Hello hello = 1;
    // The agent can take prompts (checkout done, Claude Code logged in).
    Ready ready = 4;
    // Agent output. The API assigns seq and stores everything but deltas.
    Event event = 2;
    Diff diff = 3;
    TerminalOutput terminal_output = 5;
    FileResponse file_response = 6;
    // The harness login state, sent at start and whenever it changes.
    LoginStatus login_status = 7;
    HttpTunnel http_tunnel = 8;
    // The listening ports, sent at start and whenever they change.
    PreviewPorts preview_ports = 9;
    // Answers a Ping.
    Pong pong = 10;
    // The result of a Push before a suspend, whether or not it changed.
    AutoPush pushed = 15;
  }
}

// The API asks a connected runner whether it still answers before letting
// another connection with the same token replace it.
message Ping {}

message Pong {}

message Hello {
  // Set by thread environments.
  string thread_id = 1;
  string token = 2;
  // Set instead of thread_id by a user's login environment.
  string login_user_id = 3;
}

message LoginStatus {
  string harness = 1;
  bool logged_in = 2;
}

message Ready {}

message TerminalOutput {
  bytes data = 1;
  bool exited = 2;
}

message Diff {
  string diff = 1;
}

// The answer to a FileRequest.
message FileResponse {
  string request_id = 1;
  repeated string paths = 2;
  bool truncated = 3;
  string content = 4;
  bool binary = 5;
  // Set if the request failed.
  string error = 6;
}

// API -> runner.
message ConnectResponse {
  oneof kind {
    Prompt prompt = 1;
    Stop stop = 2;
    Push push = 3;
    TerminalOpen terminal_open = 4;
    TerminalInput terminal_input = 5;
    TerminalResize terminal_resize = 6;
    TerminalClose terminal_close = 7;
    FileRequest file_request = 8;
    // Sent on connect and on every change. The runner restarts the agent with
    // them when no turn is running.
    AgentSettings agent_settings = 9;
    HttpTunnel http_tunnel = 11;
    PermissionCommand permission = 14;
    Ping ping = 15;
    // Sent on connect and when the team's audiences change: fetch IdTokens.
    IdTokensChanged id_tokens_changed = 16;
  }
}

// Answers a pending permission request (request_id set), or else configures
// the agent: sent when the runner is ready and whenever the owner changes
// the mode or always allows a tool.
message PermissionCommand {
  string request_id = 1;
  PermissionDecision decision = 2;
  string message = 3;
  // The mode to run in from now on. Unset with an answer: keep it.
  PermissionMode mode = 4;
  // Tools and rules the runner allows without asking.
  repeated string allowed_tools = 5;
  // With an allow: the answers to a question (AskUserQuestion), which the
  // runner adds to its input.
  map<string, string> answers = 6;
  // With an allow: the input to run instead.
  string updated_input_json = 7;
}

message Prompt {
  string text = 1;
  // Images referenced in the text, in order, sent as image content blocks.
  repeated AttachmentImage images = 2;
}

message AttachmentImage {
  string media_type = 1;
  bytes data = 2;
}

// Interrupts the current turn.
message Stop {}

// Push the thread branch and report the result as a notice.
message Push {
  // Before the environment is suspended: once the push before (if any) is
  // done, push again and answer with ConnectRequest.pushed, so the API knows
  // whether all work is on origin, terminal commits and edits included.
  bool suspend = 1;
}

message TerminalOpen {
  uint32 cols = 1;
  uint32 rows = 2;
  string command = 3;
}

message TerminalInput {
  bytes data = 1;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalClose {}

// Lists the checkout's files, or reads `path` from it.
message FileRequest {
  string request_id = 1;
  string path = 2;
  bool list = 3;
}

// One message of a TCP connection relayed between the API's preview proxy and
// a port in the sandbox, in either direction. The API opens it with `port`.
// Flow control: a side sends at most 8 data messages that the other has not
// acknowledged yet.
message HttpTunnel {
  string id = 1;
  uint32 port = 2;
  bytes data = 3;
  // How many of the peer's data messages were consumed.
  uint32 ack = 4;
  // The connection ended; `error` says why, if it failed.
  bool close = 5;
  string error = 6;
}

message PreviewPorts {
  repeated PreviewPort ports = 1;
}

// One thread of a Race or Fork; empty fields keep the default (or the
// forked thread's) model and effort.
message RaceTry {
  string model = 1;
  string effort = 2;
}

message ForkRequest {
  string thread_id = 1;
  // Optional new instruction. Without one the fork sums up where things stand.
  string prompt = 2;
  // Empty: one fork with the source's model and effort. At most 4.
  repeated RaceTry tries = 3;
}

message ForkResponse {
  repeated Thread threads = 1;
}

message RaceRequest {
  // Empty: no repository, as for CreateThread.
  string repo_url = 1;
  string base_branch = 2;
  string prompt = 3;
  // 2 to 4.
  repeated RaceTry tries = 4;
  // Every try's; unspecified: bypass.
  PermissionMode permission_mode = 5;
  // Every try's; empty: the caller's default profile.
  string profile = 6;
  // Every try's first message's, as for CreateThread.
  repeated Attachment attachments = 7;
}

message RaceResponse {
  repeated Thread threads = 1;
}

message RaceCompareRequest {
  // The threads of a race, and/or any threads by id.
  string race_id = 1;
  repeated string thread_ids = 2;
}

message RaceCompareResponse {
  repeated RaceEntry entries = 1;
}

message RaceEntry {
  Thread thread = 1;
  // Totals over the thread's finished turns.
  int32 turns = 2;
  double cost_usd = 3;
  int64 duration_ms = 4;
  // The agent's latest reply.
  string reply = 5;
}

message RaceListRequest {}

message RaceListResponse {
  // Grouped by race_id, newest race first.
  repeated Thread threads = 1;
}

message RacePickRequest {
  string thread_id = 1;
}

message RacePickResponse {}

message ForkPatchRequest {
  string thread_id = 1;
  string token = 2;
}

message ForkPatchResponse {
  // Empty if the thread is not a fork. A unified diff (git apply).
  string patch = 1;
  // The commit message for it.
  string message = 2;
}

enum SearchKind {
  SEARCH_KIND_UNSPECIFIED = 0;
  // Messages and turn requests by people (and agents posting through MCP).
  SEARCH_KIND_PEOPLE = 1;
  // The agent's text.
  SEARCH_KIND_AGENT = 2;
  // Tool calls and review comments.
  SEARCH_KIND_CODE = 3;
}

message SearchRequest {
  // Words, all of which must match, each also as a prefix ("auth" finds
  // "authentication").
  string query = 1;
  // Filters; empty or unset means any.
  string actor = 2;
  // Unset means any; empty, threads without a repository.
  optional string repo_url = 3;
  SearchKind kind = 4;
  google.protobuf.Timestamp after = 5;
  google.protobuf.Timestamp before = 6;
  // At most 100; 0 means 20.
  int32 limit = 7;
}

message SearchResult {
  string thread_id = 1;
  string thread_title = 2;
  string repo_url = 3;
  // The matching event; the thread page scrolls to it at /t/<id>#<seq>.
  int64 seq = 4;
  string actor = 5;
  google.protobuf.Timestamp time = 6;
  SearchKind kind = 7;
  // The matching passage in parts: odd parts are the matched words.
  repeated string snippet = 8;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

enum PullState {
  PULL_STATE_UNSPECIFIED = 0;
  PULL_STATE_OPEN = 1;
  PULL_STATE_DRAFT = 2;
  PULL_STATE_MERGED = 3;
  PULL_STATE_CLOSED = 4;
}

// A rollup of checks (GitLab: pipeline jobs), or the state of one check.
enum ChecksState {
  // None reported.
  CHECKS_STATE_UNSPECIFIED = 0;
  CHECKS_STATE_PENDING = 1;
  CHECKS_STATE_PASSING = 2;
  CHECKS_STATE_FAILING = 3;
  // One check skipped, neutral or cancelled: neither passing nor failing.
  CHECKS_STATE_SKIPPED = 4;
}

enum ReviewState {
  // No review, none requested.
  REVIEW_STATE_UNSPECIFIED = 0;
  // Reviewers are requested and nobody approved or asked for changes yet.
  REVIEW_STATE_REQUESTED = 1;
  REVIEW_STATE_APPROVED = 2;
  REVIEW_STATE_CHANGES_REQUESTED = 3;
  REVIEW_STATE_COMMENTED = 4;
}

enum Mergeable {
  // Not known: the forge is still computing it, or it is merged or closed.
  MERGEABLE_UNSPECIFIED = 0;
  MERGEABLE_CLEAN = 1;
  MERGEABLE_CONFLICTS = 2;
  // No conflicts, but the forge's rules block it (checks, reviews, draft).
  MERGEABLE_BLOCKED = 3;
}

// What lists, the header and the chat show of a pull request.
message PullRequestSummary {
  // "github" or "gitlab".
  string forge = 1;
  int32 number = 2;
  string url = 3;
  string title = 4;
  PullState state = 5;
  ChecksState checks = 6;
  ReviewState review = 7;
  Mergeable mergeable = 8;
}

message PullRequestCheck {
  string name = 1;
  ChecksState state = 2;
  // The forge's word for it, e.g. "success", "failure", "in_progress".
  string status = 3;
  string url = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
}

message PullRequestReviewer {
  string login = 1;
  // REQUESTED until they review.
  ReviewState state = 2;
}

// A comment on the pull request, a review (its verdict and summary), or a
// review comment on a line (path set). Oldest first.
message PullRequestComment {
  string id = 1;
  string author = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  string url = 5;
  // Review comments: the file, the line in the head (0: the file or an
  // outdated line), the diff around it, and the first comment of the thread
  // it replies in.
  string path = 6;
  int32 line = 7;
  string diff_hunk = 8;
  string reply_to = 9;
  // A review: its verdict.
  ReviewState review = 10;
  // The first comment of a review thread that can be resolved: the forge's
  // id of the thread (GitHub's node id, GitLab's discussion id) and whether
  // it is resolved.
  string thread_id = 11;
  bool resolved = 12;
}

message PullRequest {
  PullRequestSummary summary = 1;
  string body = 2;
  string author = 3;
  string head_branch = 4;
  string base_branch = 5;
  repeated string labels = 6;
  repeated PullRequestReviewer reviewers = 7;
  repeated PullRequestCheck checks = 8;
  repeated PullRequestComment comments = 9;
  // How it may be merged: "merge", "squash", "rebase".
  repeated string merge_methods = 10;
  // Why it can't be merged, when it is blocked.
  string merge_detail = 11;
  int32 additions = 12;
  int32 deletions = 13;
  int32 changed_files = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp merged_at = 16;
  string merged_by = 17;
  // When Banda last fetched it, and why the latest refresh failed if it did.
  google.protobuf.Timestamp fetched_at = 18;
  string error = 19;
  string head_sha = 20;
  // The forge's GraphQL id (drafts are toggled there); GitLab: empty.
  string node_id = 21;
}

// See Event.pull_request_changed. The actor is who opened or linked it, or
// "system" for what the forge reported.
message PullRequestChanged {
  PullRequestSummary pull_request = 1;
  // "opened", "linked", "ready", "draft", "checks_failed", "checks_passed",
  // "approved", "changes_requested", "merged", "closed", "reopened"; empty
  // in an ephemeral refresh.
  string change = 2;
}

message PullRequestGetRequest {
  string thread_id = 1;
  // Fetch it from the forge now instead of returning the last snapshot.
  bool refresh = 2;
}

message PullRequestGetResponse {
  // Unset when none is linked.
  PullRequest pull_request = 1;
  // The caller has a token for the forge, so they may comment.
  bool can_comment = 2;
}

message PullRequestCreateRequest {
  string thread_id = 1;
  string title = 2;
  string body = 3;
  bool draft = 4;
  // Logins (GitLab: usernames) to ask for a review, and labels to add, right
  // after it is opened.
  repeated string reviewers = 5;
  repeated string labels = 6;
}

message PullRequestCreateResponse {
  PullRequest pull_request = 1;
}

message PullRequestLinkRequest {
  string thread_id = 1;
  // 0: the open one whose head is the thread's branch.
  int32 number = 2;
}

message PullRequestLinkResponse {
  PullRequest pull_request = 1;
}

message PullRequestUpdateRequest {
  string thread_id = 1;
  optional string title = 2;
  optional string body = 3;
  optional bool draft = 4;
  // Logins (GitLab: usernames) to ask for a review.
  repeated string add_reviewers = 5;
  // Labels to add and to remove.
  repeated string add_labels = 6;
  repeated string remove_labels = 7;
}

message PullRequestUpdateResponse {
  PullRequest pull_request = 1;
}

message PullRequestMergeRequest {
  string thread_id = 1;
  // One of PullRequest.merge_methods.
  string method = 2;
}

message PullRequestMergeResponse {
  PullRequest pull_request = 1;
}

message PullRequestCommentRequest {
  string thread_id = 1;
  string body = 2;
  // Reply in the thread of this review comment (PullRequestComment.id).
  string reply_to = 3;
}

message PullRequestCommentResponse {
  PullRequest pull_request = 1;
}

message ListForgeReposRequest {
  // Searches each forge for the caller's repositories whose name matches;
  // empty lists the most recently pushed.
  string query = 1;
}

message ListForgeReposResponse {
  // The caller's most recently pushed repositories on each forge they have a
  // token for, newest first; a forge that fails is left out.
  repeated ForgeRepo repos = 1;
  // A host whose repositories aren't listed until the caller connects it.
  string connect_host = 2;
  // Its forge: "github" or "gitlab".
  string connect_forge = 3;
}

message ForgeRepo {
  // The https URL to clone.
  string url = 1;
  // owner/name, or GitLab's group/name.
  string name = 2;
  string description = 3;
  // "github" or "gitlab".
  string forge = 4;
}

message PullRequestChoicesRequest {
  string thread_id = 1;
}

message PullRequestChoicesResponse {
  // Logins (GitLab: usernames) of the repository's collaborators (GitLab:
  // project members).
  repeated string reviewers = 1;
  repeated string labels = 2;
}

message PullRequestResolveRequest {
  string thread_id = 1;
  // PullRequestComment.thread_id.
  string review_thread = 2;
  bool resolved = 3;
}

message PullRequestResolveResponse {
  PullRequest pull_request = 1;
}

message GitIdentity {
  // The caller's own choice; empty uses their sign-in's (sign_in_*).
  string name = 1;
  string email = 2;
  string sign_in_name = 3;
  string sign_in_email = 4;
}

message SetGitIdentityRequest {
  string name = 1;
  string email = 2;
}

message SetGitIdentityResponse {}

// Empty (unspecified) uses Banda's default.
message ThreadDefaults {
  string model = 1;
  string effort = 2;
  PermissionMode permission_mode = 3;
}

message SetThreadDefaultsRequest {
  ThreadDefaults defaults = 1;
}

message SetThreadDefaultsResponse {}

message RepoAdded {
  string repo_url = 1;
  string base_branch = 2;
}

message AddRepositoryRequest {
  string thread_id = 1;
  // Empty removes a repository never checked out.
  string repo_url = 2;
  // Empty is main.
  string base_branch = 3;
}

message AddRepositoryResponse {}

message IdTokensChanged {}

message IdTokensRequest {
  string thread_id = 1;
  string token = 2;
}

message IdTokensResponse {
  // Every audience's; files of audiences not listed go.
  repeated IdToken tokens = 1;
  // When to fetch again.
  int32 refresh_seconds = 2;
}

message IdToken {
  string audience = 1;
  // The file name in BANDA_ID_TOKEN_DIR.
  string file = 2;
  // A JWT signed by the issuer (internal/identity).
  string token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message GetWorkloadIdentityRequest {}

message GetWorkloadIdentityResponse {
  // PUBLIC_URL: the iss claim and where discovery is.
  string issuer = 1;
  string jwks_url = 2;
  repeated IdTokenAudience audiences = 3;
  // The repositories of the team's threads as the repo claim names them,
  // most recently used first, for the recipes.
  repeated string repos = 4;
  // The caller's sign-in email: their tokens' sub is user:<email>.
  string email = 5;
}

message IdTokenAudience {
  string audience = 1;
  // Where thread pods find its token.
  string path = 2;
  google.protobuf.Timestamp added_at = 3;
  string added_by = 4;
}

message AddIdTokenAudienceRequest {
  string audience = 1;
}

message AddIdTokenAudienceResponse {}

message RemoveIdTokenAudienceRequest {
  string audience = 1;
}

message RemoveIdTokenAudienceResponse {}

message GetGitHubRequest {}

message GetGitHubResponse {
  // Unset: no GitHub App yet.
  GitHubApp app = 1;
  // The caller's, unset: not connected.
  ForgeConnection connection = 2;
  // GitHub hosts the app can be created on: github.com and FORGE_HOSTS'.
  repeated string hosts = 3;
  // The caller has a GIT_TOKEN secret (deprecated for the app's host).
  bool legacy_token = 4;
  // The latest time someone created, replaced or removed the app; unset if never.
  GitHubAppChange last_change = 5;
  // The app the caller just created on the forge wasn't what Banda asked for, so Banda didn't keep it.
  GitHubAppRefusal refusal = 6;
}

message GitHubAppChange {
  // "created", "replaced" or "removed"
  string action = 1;
  string by = 2;
  google.protobuf.Timestamp at = 3;
  string host = 4;
  // The app it put in place; empty on remove.
  string slug = 5;
  string owner = 6;
  // The app it replaced or removed; empty on create.
  string was_slug = 7;
  string was_owner = 8;
}

message GitHubAppRefusal {
  // How it differs, e.g. "public, other permissions".
  string reason = 1;
  // Where its owner deletes it on the forge.
  string delete_url = 2;
  string slug = 3;
}

message GitHubApp {
  string host = 1;
  string slug = 2;
  // The app's page and where it is installed, on the forge.
  string url = 3;
  string install_url = 4;
  // Who created it from Settings, and when; empty when it was made by hand (a Secret from Helm or GitOps).
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  // The account that owns it.
  string owner = 7;
  // Its Secret is there but unusable, and why.
  string error = 8;
  // A user account owns it: whoever that is reaches every repository it is installed on.
  bool personal = 9;
}

// A user's OAuth connection to a forge host.
message ForgeConnection {
  string host = 1;
  // "github" or "gitlab"
  string forge = 2;
  string login = 3;
  string avatar_url = 4;
  google.protobuf.Timestamp connected_at = 5;
  // The forge no longer accepts it (revoked, expired): connect again.
  bool broken = 6;
}

message GitHubAppManifestRequest {
  // Empty is github.com.
  string host = 1;
  // Empty: the caller's own account.
  string organization = 2;
  // Replace the team's app, which ends everyone's connection to it. Without
  // it, creating one while there is an app is refused.
  bool replace = 3;
}

message GitHubAppManifestResponse {
  // Where the browser posts the form, with the manifest field.
  string url = 1;
  string manifest = 2;
}

message ListGitHubInstallationsRequest {
  // Ask the forge now: the browser is back from installing.
  bool fresh = 1;
}

message ListGitHubInstallationsResponse {
  repeated GitHubInstallation installations = 1;
}

message GitHubInstallation {
  string account = 1;
  string avatar_url = 2;
  // All the account's repositories, or repositories of them.
  bool all_repositories = 3;
  int32 repositories = 4;
  string manage_url = 5;
}

message RemoveGitHubAppRequest {}

message RemoveGitHubAppResponse {}

message DisconnectGitHubRequest {}

message DisconnectGitHubResponse {}

message GitCredentialRequest {
  string thread_id = 1;
  string token = 2;
}

message GitCredentialResponse {
  string username = 1;
  string password = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetGitLabRequest {}

message GetGitLabResponse {
  // GitLab hosts: gitlab.com and FORGE_HOSTS', gitlab.com first.
  repeated GitLabHost hosts = 1;
  // Where GitLab sends browsers back: the application's Redirect URI.
  string redirect_uri = 2;
  // The scopes the application needs: Banda's and git's.
  repeated string scopes = 3;
  // The caller has a GITLAB_TOKEN or GIT_TOKEN secret (deprecated where an application is).
  bool legacy_token = 4;
}

message GitLabHost {
  string host = 1;
  // Unset: no application on this host yet.
  GitLabApp app = 2;
  // The caller's, unset: not connected.
  ForgeConnection connection = 3;
  // Where applications are created on it: the instance's (admin; empty on
  // gitlab.com), and a group's with {group} in place of its path.
  reserved 4; // user_apps_url: whoever owns it can take everyone's tokens, so a person's account isn't offered
  string admin_apps_url = 5;
  string group_apps_url = 6;
  // The latest time someone set up, replaced or removed its application; unset if never.
  GitLabAppChange last_change = 7;
}

message GitLabAppChange {
  // "created", "replaced" or "removed"
  string action = 1;
  string by = 2;
  google.protobuf.Timestamp at = 3;
  // The application it put in place; empty on remove.
  string application_id = 4;
  // The one it replaced or removed; empty on create.
  string was_application_id = 5;
}

message GitLabApp {
  // Public: GitLab shows it in every authorize URL. The secret is never returned.
  string application_id = 1;
  // Who set it up from Settings, and when; empty when made by hand (a Secret from Helm or GitOps).
  string created_by = 2;
  google.protobuf.Timestamp created_at = 3;
  // Its Secret is there but unusable, and why.
  string error = 4;
  // GitLab refused its ID or secret when renewing a connection: someone
  // changed or deleted it on GitLab. Connections keep their tokens meanwhile.
  bool needs_attention = 5;
}

message SetGitLabAppRequest {
  string host = 1;
  string application_id = 2;
  string secret = 3;
  // Replace the host's application, which ends everyone's connection through
  // it. Without it, setting one up while there is one is refused.
  bool replace = 4;
}

message SetGitLabAppResponse {}

message RemoveGitLabAppRequest {
  string host = 1;
}

message RemoveGitLabAppResponse {}

message DisconnectGitLabRequest {
  string host = 1;
}

message DisconnectGitLabResponse {}
