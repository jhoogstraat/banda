syntax = "proto3";

package banda.v1;

import "google/protobuf/timestamp.proto";

// ThreadService is the API the web client talks to.
service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc SetMode(SetModeRequest) returns (SetModeResponse);
  // Changes the agent's model and effort (owner only). A running agent
  // restarts with them once its turns have ended; a paused one starts with them.
  rpc SetAgentSettings(SetAgentSettingsRequest) returns (SetAgentSettingsResponse);
  rpc Retry(RetryRequest) returns (RetryResponse);
  // Owner only: runs a teammate's turn request as their turn, or drops it.
  rpc ApproveTurn(ApproveTurnRequest) returns (ApproveTurnResponse);
  rpc DeclineTurn(DeclineTurnRequest) returns (DeclineTurnResponse);
  // Owner only: whether teammates can start turns without approval.
  rpc Trust(TrustRequest) returns (TrustResponse);
  // Replays stored events with seq > after_seq, then streams live events.
  rpc WatchThread(WatchThreadRequest) returns (stream WatchThreadResponse);
  // Other users' threads in which the caller is mentioned and hasn't answered.
  rpc ListMentioned(ListMentionedRequest) returns (ListMentionedResponse);
  // Per-viewer snooze; an unset `until` clears it. The owner snoozing also
  // suspends the environment.
  rpc Snooze(SnoozeRequest) returns (SnoozeResponse);
  // Per-viewer settle. The owner settling also suspends the environment.
  rpc Settle(SettleRequest) returns (SettleResponse);
  // Pushes the thread branch to origin (owner only). The result arrives as a
  // notice event.
  rpc Push(PushRequest) returns (PushResponse);
  // Provisions a fresh environment for a thread whose settled environment was
  // deleted, from its pushed branch (owner only).
  rpc EnvironmentRecreate(EnvironmentRecreateRequest) returns (EnvironmentRecreateResponse);
  // A terminal in the thread's environment (owner only). Output streams until
  // the process exits; opening again replaces the previous terminal.
  rpc OpenTerminal(OpenTerminalRequest) returns (stream OpenTerminalResponse);
  rpc WriteTerminal(WriteTerminalRequest) returns (WriteTerminalResponse);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse);
  // The tracked and unignored files of the thread's checkout, read from the
  // running environment. Fails while it is not running.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // The TCP ports listening in the thread's environment (everyone): the
  // current state, then every change. Never wakes a paused environment,
  // except for the owner with `wake` set.
  rpc PreviewWatch(PreviewWatchRequest) returns (stream PreviewWatchResponse);
  // A URL on the preview origin that shows what listens on `port`, through
  // the runner. Opening it signs the browser in to the preview origin.
  rpc PreviewOpen(PreviewOpenRequest) returns (PreviewOpenResponse);
  // The caller's sidebar: sent at once, then again whenever one of its
  // threads changes or the caller is mentioned somewhere new.
  rpc InboxWatch(InboxWatchRequest) returns (stream InboxWatchResponse);
  // Marks the thread read for the caller, up to its latest event.
  rpc InboxMarkRead(InboxMarkReadRequest) returns (InboxMarkReadResponse);
  // Tells the thread's watchers that the caller is typing. The composer calls
  // it every few seconds while typing; clients forget it after a few seconds.
  rpc SendTyping(TypingRequest) returns (TypingResponse);
}

service UserService {
  rpc Me(MeRequest) returns (MeResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// SettingsService is the caller's own harness accounts and secrets.
// Secret and API key values are write-only: no RPC ever returns them.
service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Chooses how a harness signs in. Applies to environments started
  // afterwards. An API key, when given, replaces the stored one.
  rpc SetAuthMethod(SetAuthMethodRequest) returns (SetAuthMethodResponse);
  // Creates or replaces a secret, passed to all the caller's environments as
  // an environment variable. Reserved names (harness credentials) are refused.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // A terminal in the caller's login environment: a small pod that mounts
  // only the caller's harness config volume, started on demand. It runs the
  // harness's login or logout command. Output streams until it exits.
  rpc OpenLoginTerminal(OpenLoginTerminalRequest) returns (stream OpenTerminalResponse);
  rpc WriteLoginTerminal(WriteLoginTerminalRequest) returns (WriteTerminalResponse);
  rpc ResizeLoginTerminal(ResizeLoginTerminalRequest) returns (ResizeTerminalResponse);
}

// RunnerService is dialed by the runner inside each sandbox pod, so the API
// never has to reach into pods.
service RunnerService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_STARTING = 1;
  STATUS_WORKING = 2;
  STATUS_AWAITING_INPUT = 3;
  STATUS_ERRORED = 4;
  // Idle with the environment paused; the next prompt resumes it.
  STATUS_SUSPENDED = 5;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // Every owner message starts a turn.
  MODE_AGENT = 1;
  // Only messages that mention the agent start a turn.
  MODE_CHAT = 2;
}

message Thread {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  string repo_url = 4;
  string branch = 5;
  string model = 6;
  string effort = 7;
  Status status = 8;
  Mode mode = 9;
  // Unified diff of the branch against its base, refreshed after each turn.
  string diff = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string base_branch = 13;
  // The caller's own view of the thread.
  google.protobuf.Timestamp snoozed_until = 14;
  bool settled = 15;
  // Teammate turn requests waiting for the owner's approval.
  int32 turn_requests = 18;
  // Teammates start turns without the owner's approval.
  bool trusted = 19;
  // The thread has events the caller hasn't seen (see InboxMarkRead).
  bool unread = 16;
  // Where the thread's work lives, as the runner last reported it.
  AutoPushState auto_push = 22;
  // The settled environment and its volume were deleted; the branch is on
  // origin (see EnvironmentRecreate).
  bool environment_deleted = 23;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message Event {
  string thread_id = 1;
  // Order within the thread. 0 for ephemeral events that are not stored.
  int64 seq = 2;
  google.protobuf.Timestamp time = 3;
  // User id, "agent" or "system".
  string actor = 4;
  oneof kind {
    Message message = 10;
    AgentText agent_text = 11;
    AgentTextDelta agent_text_delta = 12;
    AgentThinking agent_thinking = 13;
    ToolCall tool_call = 14;
    ToolResult tool_result = 15;
    TurnEnded turn_ended = 16;
    StatusChanged status_changed = 17;
    ModeChanged mode_changed = 18;
    DiffChanged diff_changed = 19;
    Notice notice = 20;
    SetupStep setup_step = 21;
    TurnRequest turn_request = 24;
    TurnRequestResolved turn_request_resolved = 25;
    // Ephemeral (seq 0): who is watching the thread.
    PresenceChanged presence_changed = 22;
    // Ephemeral (seq 0): the actor is typing in the composer.
    Typing typing = 23;
    // The owner changed the model or effort; actor is the owner.
    AgentSettings agent_settings = 26;
    // Where the work lives changed, e.g. after an auto-push.
    AutoPush auto_push = 29;
  }
}

message Message {
  string text = 1;
  bool mentions_agent = 2;
  repeated string mentioned_user_ids = 3;
  // Comments on the thread's diff, posted together as one review. `text` is
  // then an optional summary.
  repeated ReviewComment review = 4;
}

// A comment on a line range of the diff.
message ReviewComment {
  string path = 1;
  // Line numbers in the branch's version of the file, or in the base version
  // when `old` is set (the range has only removed lines).
  int32 start_line = 2;
  int32 end_line = 3;
  bool old = 4;
  // The commented diff lines, with their +/-/space prefixes.
  string code = 5;
  string body = 6;
}

// A teammate's message to the agent, waiting for the owner's approval
// (instead of a Message event). The actor is the teammate.
message TurnRequest {
  Message message = 1;
}

// The owner approved or declined the TurnRequest event at request_seq.
message TurnRequestResolved {
  int64 request_seq = 1;
  bool approved = 2;
  string note = 3;
}

message AgentText {
  string text = 1;
}

// Ephemeral streaming chunk of the agent text that is being written.
message AgentTextDelta {
  string text = 1;
}

message AgentThinking {
  string text = 1;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string input_json = 3;
  // Set when a subagent made the call: the id of the Task tool call that started it.
  string parent_tool_call_id = 4;
}

message ToolResult {
  string tool_call_id = 1;
  string output = 2;
  bool is_error = 3;
}

message TurnEnded {
  bool is_error = 1;
  string error = 2;
  int64 duration_ms = 3;
  double cost_usd = 4;
}

message StatusChanged {
  Status status = 1;
  string reason = 2;
}

message ModeChanged {
  Mode mode = 1;
}

message DiffChanged {}

// Something the user needs to know or do, e.g. log in to Claude Code.
message Notice {
  string text = 1;
}

// Progress of one step of preparing the environment. A later event with the
// same id replaces an earlier one.
message SetupStep {
  // "checkout", "tools" (mise install), "setup" (.banda/setup.sh), "login".
  string id = 1;
  string title = 2;
  SetupState state = 3;
  // Redacted, truncated output; set when the step has finished.
  string output = 4;
}

// Sent whenever someone starts watching the thread or the last tab of a user
// stops.
message PresenceChanged {
  // Every user with at least one open WatchThread stream, sorted.
  repeated string user_ids = 1;
}

message Typing {}

message TypingRequest {
  string thread_id = 1;
}

message TypingResponse {}

enum SetupState {
  SETUP_STATE_UNSPECIFIED = 0;
  SETUP_STATE_RUNNING = 1;
  SETUP_STATE_DONE = 2;
  SETUP_STATE_FAILED = 3;
  // Nothing to do, e.g. the repo has no .banda/setup.sh.
  SETUP_STATE_SKIPPED = 4;
}

message CreateThreadRequest {
  string repo_url = 1;
  string base_branch = 2;
  string model = 3;
  string effort = 4;
  string prompt = 5;
}

message CreateThreadResponse {
  Thread thread = 1;
}

message ListThreadsRequest {
  // Empty means the caller.
  string owner_id = 1;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}

message GetThreadRequest {
  string thread_id = 1;
}

message GetThreadResponse {
  Thread thread = 1;
}

message SendMessageRequest {
  string thread_id = 1;
  Message message = 2;
}

message SendMessageResponse {}

message InterruptRequest {
  string thread_id = 1;
}

message InterruptResponse {}

message SetModeRequest {
  string thread_id = 1;
  Mode mode = 2;
}

message SetModeResponse {}

// The agent's model and effort.
message AgentSettings {
  string model = 1;
  string effort = 2;
}

message SetAgentSettingsRequest {
  string thread_id = 1;
  // Empty keeps the current value.
  string model = 2;
  string effort = 3;
}

message SetAgentSettingsResponse {}

message RetryRequest {
  string thread_id = 1;
}

message RetryResponse {}

message ApproveTurnRequest {
  string thread_id = 1;
  // Seq of the TurnRequest event.
  int64 request_seq = 2;
}

message ApproveTurnResponse {}

message DeclineTurnRequest {
  string thread_id = 1;
  int64 request_seq = 2;
  // Optional, shown to the requester.
  string note = 3;
}

message DeclineTurnResponse {}

message TrustRequest {
  string thread_id = 1;
  bool trusted = 2;
}

message TrustResponse {}

message ListMentionedRequest {}

message ListMentionedResponse {
  repeated Thread threads = 1;
}

message SnoozeRequest {
  string thread_id = 1;
  google.protobuf.Timestamp until = 2;
}

message SnoozeResponse {}

message SettleRequest {
  string thread_id = 1;
  bool settled = 2;
}

message SettleResponse {}

message PushRequest {
  string thread_id = 1;
}

message PushResponse {}

message EnvironmentRecreateRequest {
  string thread_id = 1;
}

message EnvironmentRecreateResponse {}

enum AutoPushState {
  // Nothing reported yet.
  AUTO_PUSH_STATE_UNSPECIFIED = 0;
  // origin has the branch, and the checkout has nothing origin doesn't.
  AUTO_PUSH_STATE_PUSHED = 1;
  // Commits or uncommitted changes exist only in the checkout.
  AUTO_PUSH_STATE_UNPUSHED = 2;
  // origin can't be pushed to (no token, read-only): the work only lives in
  // the environment's volume.
  AUTO_PUSH_STATE_UNAVAILABLE = 3;
}

// Sent by the runner after a turn changed the diff, or a push, when the
// state or its detail changed.
message AutoPush {
  AutoPushState state = 1;
  string detail = 2;
}

message OpenTerminalRequest {
  string thread_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  // Empty runs a login shell.
  string command = 4;
}

message OpenTerminalResponse {
  bytes data = 1;
  bool exited = 2;
}

message WriteTerminalRequest {
  string thread_id = 1;
  bytes data = 2;
}

message WriteTerminalResponse {}

message ResizeTerminalRequest {
  string thread_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ResizeTerminalResponse {}

message ListFilesRequest {
  string thread_id = 1;
}

message ListFilesResponse {
  repeated string paths = 1;
  // The checkout has more files than were listed.
  bool truncated = 2;
}

message ReadFileRequest {
  string thread_id = 1;
  // Relative to the checkout.
  string path = 2;
}

message ReadFileResponse {
  // Empty for binary files.
  string content = 1;
  bool binary = 2;
  // The file is longer than the part in `content`.
  bool truncated = 3;
}

message PreviewWatchRequest {
  string thread_id = 1;
  bool wake = 2;
}

message PreviewWatchResponse {
  // A runner is connected; without one there are no ports.
  bool running = 1;
  repeated PreviewPort ports = 2;
}

message PreviewPort {
  uint32 port = 1;
  // What listens, e.g. "vite", "next" or "http.server". May be empty.
  string process = 2;
}

message PreviewOpenRequest {
  string thread_id = 1;
  uint32 port = 2;
  // Where to start, e.g. "/" or "/login?x=1".
  string path = 3;
}

message PreviewOpenResponse {
  string url = 1;
}

message MeRequest {}

message MeResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  // The user's own subscription, logged in with the harness's login command.
  // Banda never sees the credentials.
  AUTH_METHOD_SUBSCRIPTION = 1;
  // An API key stored by Banda and passed to the environment.
  AUTH_METHOD_API_KEY = 2;
}

enum LoginState {
  LOGIN_STATE_UNSPECIFIED = 0;
  // Never checked.
  LOGIN_STATE_UNKNOWN = 1;
  LOGIN_STATE_LOGGED_IN = 2;
  LOGIN_STATE_LOGGED_OUT = 3;
}

message HarnessAccount {
  // "claude". Later "codex".
  string harness = 1;
  string display_name = 2;
  AuthMethod auth_method = 3;
  bool api_key_set = 4;
  // Subscription login as last reported by one of the user's environments.
  LoginState login_state = 5;
  google.protobuf.Timestamp login_checked_at = 6;
}

message SecretInfo {
  string name = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  repeated HarnessAccount accounts = 1;
  repeated SecretInfo secrets = 2;
}

message SetAuthMethodRequest {
  string harness = 1;
  AuthMethod auth_method = 2;
  // Required when switching to API_KEY and none is stored yet.
  string api_key = 3;
}

message SetAuthMethodResponse {}

message SetSecretRequest {
  // An environment variable name: [A-Z_][A-Z0-9_]*.
  string name = 1;
  string value = 2;
}

message SetSecretResponse {}

message DeleteSecretRequest {
  string name = 1;
}

message DeleteSecretResponse {}

enum LoginAction {
  LOGIN_ACTION_UNSPECIFIED = 0;
  LOGIN_ACTION_LOGIN = 1;
  LOGIN_ACTION_LOGOUT = 2;
}

message OpenLoginTerminalRequest {
  string harness = 1;
  LoginAction action = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message WriteLoginTerminalRequest {
  string harness = 1;
  bytes data = 2;
}

message ResizeLoginTerminalRequest {
  string harness = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message InboxWatchRequest {}

message InboxWatchResponse {
  // As ListThreads and ListMentioned return them.
  repeated Thread threads = 1;
  repeated Thread mentioned = 2;
}

message InboxMarkReadRequest {
  string thread_id = 1;
}

message InboxMarkReadResponse {}

message WatchThreadRequest {
  string thread_id = 1;
  int64 after_seq = 2;
}

message WatchThreadResponse {
  Event event = 1;
}

// Runner -> API.
message ConnectRequest {
  oneof kind {
    // First message on every connection.
    Hello hello = 1;
    // The agent can take prompts (checkout done, Claude Code logged in).
    Ready ready = 4;
    // Agent output. The API assigns seq and stores everything but deltas.
    Event event = 2;
    Diff diff = 3;
    TerminalOutput terminal_output = 5;
    FileResponse file_response = 6;
    // The harness login state, sent at start and whenever it changes.
    LoginStatus login_status = 7;
    HttpTunnel http_tunnel = 8;
    // The listening ports, sent at start and whenever they change.
    PreviewPorts preview_ports = 9;
  }
}

message Hello {
  // Set by thread environments.
  string thread_id = 1;
  string token = 2;
  // Set instead of thread_id by a user's login environment.
  string login_user_id = 3;
}

message LoginStatus {
  string harness = 1;
  bool logged_in = 2;
}

message Ready {}

message TerminalOutput {
  bytes data = 1;
  bool exited = 2;
}

message Diff {
  string diff = 1;
}

// The answer to a FileRequest.
message FileResponse {
  string request_id = 1;
  repeated string paths = 2;
  bool truncated = 3;
  string content = 4;
  bool binary = 5;
  // Set if the request failed.
  string error = 6;
}

// API -> runner.
message ConnectResponse {
  oneof kind {
    Prompt prompt = 1;
    Stop stop = 2;
    Push push = 3;
    TerminalOpen terminal_open = 4;
    TerminalInput terminal_input = 5;
    TerminalResize terminal_resize = 6;
    TerminalClose terminal_close = 7;
    FileRequest file_request = 8;
    // Sent on connect and on every change. The runner restarts the agent with
    // them when no turn is running.
    AgentSettings agent_settings = 9;
    HttpTunnel http_tunnel = 11;
  }
}

message Prompt {
  string text = 1;
}

// Interrupts the current turn.
message Stop {}

// Push the thread branch and report the result as a notice.
message Push {}

message TerminalOpen {
  uint32 cols = 1;
  uint32 rows = 2;
  string command = 3;
}

message TerminalInput {
  bytes data = 1;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalClose {}

// Lists the checkout's files, or reads `path` from it.
message FileRequest {
  string request_id = 1;
  string path = 2;
  bool list = 3;
}

// One message of a TCP connection relayed between the API's preview proxy and
// a port in the sandbox, in either direction. The API opens it with `port`.
// Flow control: a side sends at most 8 data messages that the other has not
// acknowledged yet.
message HttpTunnel {
  string id = 1;
  uint32 port = 2;
  bytes data = 3;
  // How many of the peer's data messages were consumed.
  uint32 ack = 4;
  // The connection ended; `error` says why, if it failed.
  bool close = 5;
  string error = 6;
}

message PreviewPorts {
  repeated PreviewPort ports = 1;
}
