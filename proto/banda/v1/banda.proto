syntax = "proto3";

package banda.v1;

import "google/protobuf/timestamp.proto";

// ThreadService is the API the web client talks to.
service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc SetMode(SetModeRequest) returns (SetModeResponse);
  // Changes the agent's model and effort (owner only). A running agent
  // restarts with them once its turns have ended; a paused one starts with them.
  rpc SetAgentSettings(SetAgentSettingsRequest) returns (SetAgentSettingsResponse);
  rpc Retry(RetryRequest) returns (RetryResponse);
  // Owner only: runs a teammate's turn request as their turn, or drops it.
  rpc ApproveTurn(ApproveTurnRequest) returns (ApproveTurnResponse);
  rpc DeclineTurn(DeclineTurnRequest) returns (DeclineTurnResponse);
  // Owner only: whether teammates can start turns without approval.
  rpc Trust(TrustRequest) returns (TrustResponse);
  // A sub-thread of parent_id, owned by the caller. It starts from the
  // parent's branch if that was pushed, else from the parent's base branch.
  rpc SpawnThread(SpawnThreadRequest) returns (SpawnThreadResponse);
  // The sub-threads of a thread, most recently active first.
  rpc LineageChildren(LineageChildrenRequest) returns (LineageChildrenResponse);
  // Replays stored events with seq > after_seq (or the last `tail`), then
  // streams live events. Large payloads are cut (Event.truncated).
  rpc WatchThread(WatchThreadRequest) returns (stream WatchThreadResponse);
  // Older stored events, for paging back from a tail, or one event in full.
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Other users' threads in which the caller is mentioned and hasn't answered.
  rpc ListMentioned(ListMentionedRequest) returns (ListMentionedResponse);
  // Per-viewer snooze; an unset `until` clears it. The owner snoozing also
  // suspends the environment.
  rpc Snooze(SnoozeRequest) returns (SnoozeResponse);
  // Per-viewer settle. The owner settling also suspends the environment.
  rpc Settle(SettleRequest) returns (SettleResponse);
  // Pushes the thread branch to origin (owner only). The result arrives as a
  // notice event.
  rpc Push(PushRequest) returns (PushResponse);
  // Provisions a fresh environment for a thread whose settled environment was
  // deleted, from its pushed branch (owner only).
  rpc EnvironmentRecreate(EnvironmentRecreateRequest) returns (EnvironmentRecreateResponse);
  // A terminal in the thread's environment (owner only). Output streams until
  // the process exits; opening again replaces the previous terminal.
  rpc OpenTerminal(OpenTerminalRequest) returns (stream OpenTerminalResponse);
  rpc WriteTerminal(WriteTerminalRequest) returns (WriteTerminalResponse);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse);
  // The tracked and unignored files of the thread's checkout, read from the
  // running environment. Fails while it is not running.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // The TCP ports listening in the thread's environment (everyone): the
  // current state, then every change. Never wakes a paused environment,
  // except for the owner with `wake` set.
  rpc PreviewWatch(PreviewWatchRequest) returns (stream PreviewWatchResponse);
  // A URL on the preview origin that shows what listens on `port`, through
  // the runner. Opening it signs the browser in to the preview origin.
  rpc PreviewOpen(PreviewOpenRequest) returns (PreviewOpenResponse);
  // The caller's sidebar: sent at once, then again whenever one of its
  // threads changes or the caller is mentioned somewhere new.
  rpc InboxWatch(InboxWatchRequest) returns (stream InboxWatchResponse);
  // Marks the thread read for the caller, up to its latest event.
  rpc InboxMarkRead(InboxMarkReadRequest) returns (InboxMarkReadResponse);
  // Tells the thread's watchers that the caller is typing. The composer calls
  // it every few seconds while typing; clients forget it after a few seconds.
  rpc SendTyping(TypingRequest) returns (TypingResponse);
  // Everyone's recent threads that their owners haven't settled, with their
  // last activity and who is looking at them: sent at once, then again
  // (coalesced) whenever one changes.
  rpc TeamWatch(TeamWatchRequest) returns (stream TeamWatchResponse);
  // Answers the agent's pending permission request: the owner, or anyone in
  // a trusted thread. Approving a plan (ExitPlanMode) is for the owner only
  // and switches the thread to `mode`.
  rpc PermissionAnswer(PermissionAnswerRequest) returns (PermissionAnswerResponse);
  // Sets which tool calls the agent must ask for (owner only). Applies to the
  // running agent at once.
  rpc PermissionSetMode(PermissionSetModeRequest) returns (PermissionSetModeResponse);
  // Starts threads (one per try) from another thread's current changes and
  // conversation, owned by the caller. Anyone who can see a thread can fork it.
  rpc Fork(ForkRequest) returns (ForkResponse);
  // Starts sibling threads with the same prompt, one per try.
  rpc Race(RaceRequest) returns (RaceResponse);
  // Status, cost, time and diff of threads, side by side.
  rpc RaceCompare(RaceCompareRequest) returns (RaceCompareResponse);
  // Keeps one thread of a race (owner only): settles its siblings for the
  // caller and notes the pick in each.
  rpc RacePick(RacePickRequest) returns (RacePickResponse);
  // Full-text search over every thread's messages, review comments, agent
  // text and tool calls, best matches first.
  rpc Search(SearchRequest) returns (SearchResponse);
}

service UserService {
  rpc Me(MeRequest) returns (MeResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// SettingsService is the caller's own harness accounts and secrets.
// Secret and API key values are write-only: no RPC ever returns them.
service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Chooses how a harness signs in. Applies to environments started
  // afterwards. An API key, when given, replaces the stored one.
  rpc SetAuthMethod(SetAuthMethodRequest) returns (SetAuthMethodResponse);
  // Creates or replaces a secret, passed to all the caller's environments as
  // an environment variable. Reserved names (harness credentials) are refused.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // A terminal in the caller's login environment: a small pod that mounts
  // only the caller's harness config volume, started on demand. It runs the
  // harness's login or logout command. Output streams until it exits.
  rpc OpenLoginTerminal(OpenLoginTerminalRequest) returns (stream OpenTerminalResponse);
  rpc WriteLoginTerminal(WriteLoginTerminalRequest) returns (WriteTerminalResponse);
  rpc ResizeLoginTerminal(ResizeLoginTerminalRequest) returns (ResizeTerminalResponse);
}

// RunnerService is dialed by the runner inside each sandbox pod, so the API
// never has to reach into pods.
service RunnerService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  // The changes a fork starts from, applied once after the first checkout.
  rpc ForkPatch(ForkPatchRequest) returns (ForkPatchResponse);
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_STARTING = 1;
  STATUS_WORKING = 2;
  STATUS_AWAITING_INPUT = 3;
  STATUS_ERRORED = 4;
  // Idle with the environment paused; the next prompt resumes it.
  STATUS_SUSPENDED = 5;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // Every owner message starts a turn.
  MODE_AGENT = 1;
  // Only messages that mention the agent start a turn.
  MODE_CHAT = 2;
}

message Thread {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  string repo_url = 4;
  string branch = 5;
  string model = 6;
  string effort = 7;
  Status status = 8;
  Mode mode = 9;
  // Unified diff of the branch against its base, refreshed after each turn.
  string diff = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string base_branch = 13;
  // The caller's own view of the thread.
  google.protobuf.Timestamp snoozed_until = 14;
  bool settled = 15;
  // Teammate turn requests waiting for the owner's approval.
  int32 turn_requests = 18;
  // Teammates start turns without the owner's approval.
  bool trusted = 19;
  // The thread has events the caller hasn't seen (see InboxMarkRead).
  bool unread = 16;
  // The latest thing that happened, for passers-by. Set in lists only.
  TeamActivity activity = 20;
  // Users with the thread open right now. Set by TeamWatch only.
  repeated string present_user_ids = 21;
  // Where the thread's work lives, as the runner last reported it.
  AutoPushState auto_push = 22;
  // The settled environment and its volume were deleted; the branch is on
  // origin (see EnvironmentRecreate).
  bool environment_deleted = 23;
  PermissionMode permission_mode = 24;
  // The agent waits for an answer to a permission request.
  bool permission_pending = 25;
  // Set if the thread was forked from another one.
  ForkOrigin forked_from = 28;
  // Shared by the threads started together by one Race or Fork.
  string race_id = 29;
  // The thread this one was spawned from, if any.
  string parent_id = 26;
  string parent_title = 27;
  // A GitHub pull request for the branch, once it is pushed.
  string pull_request_url = 30;
}

// Which tool calls the agent asks for, mapped to Claude Code's
// --permission-mode. Requests arrive as PermissionRequested events.
enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  // Nothing asks (bypassPermissions): the sandbox is the boundary.
  PERMISSION_MODE_BYPASS = 1;
  // Reads run, edits and commands ask (default).
  PERMISSION_MODE_ASK = 2;
  // Reads and edits run, other commands ask (acceptEdits).
  PERMISSION_MODE_ACCEPT_EDITS = 3;
  // Read-only planning until the owner approves the plan (plan).
  PERMISSION_MODE_PLAN = 4;
}

enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  PERMISSION_DECISION_ALLOW = 1;
  // Allow, and allow this tool without asking for the rest of the thread.
  PERMISSION_DECISION_ALLOW_ALWAYS = 2;
  PERMISSION_DECISION_DENY = 3;
  // The agent withdrew the request, e.g. the turn was interrupted.
  PERMISSION_DECISION_CANCELED = 4;
  // The environment restarted before an answer; that turn is gone.
  PERMISSION_DECISION_LOST = 5;
}

message ForkOrigin {
  string thread_id = 1;
  // Turns the source thread had finished when it was forked.
  int32 turn = 2;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message Event {
  string thread_id = 1;
  // Order within the thread. 0 for ephemeral events that are not stored.
  int64 seq = 2;
  google.protobuf.Timestamp time = 3;
  // User id, "agent" or "system".
  string actor = 4;
  // Sent before a tail for its context, not in seq order: the latest plan
  // (TodoWrite call) from before the tail. Not part of the chat.
  bool context = 5;
  // A large payload (a tool call's input strings, a tool result's output) was
  // cut to a few KB. History with full loads the whole event.
  bool truncated = 6;
  oneof kind {
    Message message = 10;
    AgentText agent_text = 11;
    AgentTextDelta agent_text_delta = 12;
    AgentThinking agent_thinking = 13;
    ToolCall tool_call = 14;
    ToolResult tool_result = 15;
    TurnEnded turn_ended = 16;
    StatusChanged status_changed = 17;
    ModeChanged mode_changed = 18;
    DiffChanged diff_changed = 19;
    Notice notice = 20;
    SetupStep setup_step = 21;
    TurnRequest turn_request = 24;
    TurnRequestResolved turn_request_resolved = 25;
    // Ephemeral (seq 0): who is watching the thread.
    PresenceChanged presence_changed = 22;
    // Ephemeral (seq 0): the actor is typing in the composer.
    Typing typing = 23;
    // The owner changed the model or effort; actor is the owner.
    AgentSettings agent_settings = 26;
    // Where the work lives changed, e.g. after an auto-push.
    AutoPush auto_push = 29;
    PermissionRequested permission_requested = 30;
    PermissionResolved permission_resolved = 31;
    // Links another thread: a fork of this one, or the pick of a race.
    ForkNote fork_note = 33;
    LineageUpdate lineage_update = 32;
    // The owner changed the permission mode; actor is the owner.
    PermissionModeChanged permission_mode_changed = 34;
    // A port started listening in the environment (see PreviewWatch); the
    // ports already listening when a runner connects aren't announced.
    PreviewPort port_opened = 40;
  }
}

message ForkNote {
  // The fork, or the thread picked in the race.
  string thread_id = 1;
  string title = 2;
  // false: `thread_id` was forked from this thread after `turn` turns.
  // true: the actor picked `thread_id` (maybe this thread) in its race.
  bool picked = 3;
  int32 turn = 4;
}

message Message {
  string text = 1;
  bool mentions_agent = 2;
  repeated string mentioned_user_ids = 3;
  // Comments on the thread's diff, posted together as one review. `text` is
  // then an optional summary.
  repeated ReviewComment review = 4;
  // Files uploaded with POST /files and posted with the message. The API
  // fills in name, media type and size from the upload.
  repeated Attachment attachments = 6;
}

// A comment on a line range of the diff.
message ReviewComment {
  string path = 1;
  // Line numbers in the branch's version of the file, or in the base version
  // when `old` is set (the range has only removed lines).
  int32 start_line = 2;
  int32 end_line = 3;
  bool old = 4;
  // The commented diff lines, with their +/-/space prefixes.
  string code = 5;
  string body = 6;
}

// An image or small text file, served at GET /files/<id>. Images reach the
// agent as image blocks, text files inlined in the prompt.
message Attachment {
  string id = 1;
  string name = 2;
  // image/png, image/jpeg, image/gif, image/webp, or text/plain.
  string media_type = 3;
  int64 size = 4;
}

// A teammate's message to the agent, waiting for the owner's approval
// (instead of a Message event). The actor is the teammate.
message TurnRequest {
  Message message = 1;
}

// The owner approved or declined the TurnRequest event at request_seq.
message TurnRequestResolved {
  int64 request_seq = 1;
  bool approved = 2;
  string note = 3;
}

// In a parent thread: a sub-thread was spawned (status STARTING), finished a
// turn (AWAITING_INPUT, text is the first line of its last agent text) or
// failed (ERRORED, text is why).
message LineageUpdate {
  string thread_id = 1;
  string title = 2;
  Status status = 3;
  string text = 4;
}

message AgentText {
  string text = 1;
}

// Ephemeral streaming chunk of the agent text that is being written.
message AgentTextDelta {
  string text = 1;
}

message AgentThinking {
  string text = 1;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string input_json = 3;
  // Set when a subagent made the call: the id of the Task tool call that started it.
  string parent_tool_call_id = 4;
}

message ToolResult {
  string tool_call_id = 1;
  string output = 2;
  bool is_error = 3;
}

message TurnEnded {
  bool is_error = 1;
  string error = 2;
  int64 duration_ms = 3;
  double cost_usd = 4;
  // The prompts the turn ended: its own and those folded into it.
  int32 prompts = 5;
}

message StatusChanged {
  Status status = 1;
  string reason = 2;
}

// The actor is who changed it: the owner, or the poster whose message
// switched the thread to chat mode (`reason` says why). Older events: "system".
message ModeChanged {
  Mode mode = 1;
  // Set when a post switched the mode: "posted" (a teammate) or "mentioned
  // someone".
  string reason = 2;
}

message DiffChanged {}

// Something the user needs to know or do, e.g. log in to Claude Code.
message Notice {
  string text = 1;
}

// Progress of one step of preparing the environment. A later event with the
// same id replaces an earlier one.
message SetupStep {
  // "checkout", "tools" (mise install), "setup" (.banda/setup.sh), "login".
  string id = 1;
  string title = 2;
  SetupState state = 3;
  // Redacted, truncated output; set when the step has finished.
  string output = 4;
}

// Sent whenever someone starts watching the thread or the last tab of a user
// stops.
message PresenceChanged {
  // Every user with at least one open WatchThread stream, sorted.
  repeated string user_ids = 1;
}

message Typing {}

message TypingRequest {
  string thread_id = 1;
}

message TypingResponse {}

enum SetupState {
  SETUP_STATE_UNSPECIFIED = 0;
  SETUP_STATE_RUNNING = 1;
  SETUP_STATE_DONE = 2;
  SETUP_STATE_FAILED = 3;
  // Nothing to do, e.g. the repo has no .banda/setup.sh.
  SETUP_STATE_SKIPPED = 4;
}

message CreateThreadRequest {
  string repo_url = 1;
  string base_branch = 2;
  string model = 3;
  string effort = 4;
  string prompt = 5;
  // Unspecified: bypass.
  PermissionMode permission_mode = 6;
}

message CreateThreadResponse {
  Thread thread = 1;
}

message ListThreadsRequest {
  // Empty means the caller.
  string owner_id = 1;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}

message GetThreadRequest {
  string thread_id = 1;
}

message GetThreadResponse {
  Thread thread = 1;
}

message SendMessageRequest {
  string thread_id = 1;
  Message message = 2;
}

message SendMessageResponse {}

message InterruptRequest {
  string thread_id = 1;
}

message InterruptResponse {}

message SetModeRequest {
  string thread_id = 1;
  Mode mode = 2;
}

message SetModeResponse {}

// The agent's model and effort.
message AgentSettings {
  string model = 1;
  string effort = 2;
}

message SetAgentSettingsRequest {
  string thread_id = 1;
  // Empty keeps the current value.
  string model = 2;
  string effort = 3;
}

message SetAgentSettingsResponse {}

message RetryRequest {
  string thread_id = 1;
}

message RetryResponse {}

message ApproveTurnRequest {
  string thread_id = 1;
  // Seq of the TurnRequest event.
  int64 request_seq = 2;
}

message ApproveTurnResponse {}

message DeclineTurnRequest {
  string thread_id = 1;
  int64 request_seq = 2;
  // Optional, shown to the requester.
  string note = 3;
}

message DeclineTurnResponse {}

message TrustRequest {
  string thread_id = 1;
  bool trusted = 2;
}

message TrustResponse {}

message SpawnThreadRequest {
  string parent_id = 1;
  string prompt = 2;
  // Defaults: see SpawnThread; repo, model and effort are the parent's.
  string base_branch = 3;
  string model = 4;
  string effort = 5;
}

message SpawnThreadResponse {
  Thread thread = 1;
}

message LineageChildrenRequest {
  string thread_id = 1;
}

message LineageChildrenResponse {
  repeated Thread threads = 1;
}

message ListMentionedRequest {}

message ListMentionedResponse {
  repeated Thread threads = 1;
}

message SnoozeRequest {
  string thread_id = 1;
  google.protobuf.Timestamp until = 2;
}

message SnoozeResponse {}

message SettleRequest {
  string thread_id = 1;
  bool settled = 2;
}

message SettleResponse {}

message PushRequest {
  string thread_id = 1;
}

message PushResponse {}

message EnvironmentRecreateRequest {
  string thread_id = 1;
}

message EnvironmentRecreateResponse {}

enum AutoPushState {
  // Nothing reported yet.
  AUTO_PUSH_STATE_UNSPECIFIED = 0;
  // origin has the branch, and the checkout has nothing origin doesn't.
  AUTO_PUSH_STATE_PUSHED = 1;
  // Commits or uncommitted changes exist only in the checkout.
  AUTO_PUSH_STATE_UNPUSHED = 2;
  // origin can't be pushed to (no token, read-only): the work only lives in
  // the environment's volume.
  AUTO_PUSH_STATE_UNAVAILABLE = 3;
}

// Sent by the runner after a turn changed the diff, or a push, when the
// state or its detail changed.
message AutoPush {
  AutoPushState state = 1;
  string detail = 2;
  // The push went through: the branch's commits are on origin, even if
  // uncommitted changes are not (state UNPUSHED).
  bool branch_pushed = 3;
}

message OpenTerminalRequest {
  string thread_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  // Empty runs a login shell.
  string command = 4;
}

message OpenTerminalResponse {
  bytes data = 1;
  bool exited = 2;
}

message WriteTerminalRequest {
  string thread_id = 1;
  bytes data = 2;
}

message WriteTerminalResponse {}

message ResizeTerminalRequest {
  string thread_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ResizeTerminalResponse {}

message ListFilesRequest {
  string thread_id = 1;
}

message ListFilesResponse {
  repeated string paths = 1;
  // The checkout has more files than were listed.
  bool truncated = 2;
}

message ReadFileRequest {
  string thread_id = 1;
  // Relative to the checkout.
  string path = 2;
}

message ReadFileResponse {
  // Empty for binary files.
  string content = 1;
  bool binary = 2;
  // The file is longer than the part in `content`.
  bool truncated = 3;
}

message PreviewWatchRequest {
  string thread_id = 1;
  bool wake = 2;
}

message PreviewWatchResponse {
  // A runner is connected; without one there are no ports.
  bool running = 1;
  repeated PreviewPort ports = 2;
}

message PreviewPort {
  uint32 port = 1;
  // What listens, e.g. "vite", "next" or "http.server". May be empty.
  string process = 2;
}

message PreviewOpenRequest {
  string thread_id = 1;
  uint32 port = 2;
  // Where to start, e.g. "/" or "/login?x=1".
  string path = 3;
}

message PreviewOpenResponse {
  string url = 1;
}

message MeRequest {}

message MeResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  // The user's own subscription, logged in with the harness's login command.
  // Banda never sees the credentials.
  AUTH_METHOD_SUBSCRIPTION = 1;
  // An API key stored by Banda and passed to the environment.
  AUTH_METHOD_API_KEY = 2;
}

enum LoginState {
  LOGIN_STATE_UNSPECIFIED = 0;
  // Never checked.
  LOGIN_STATE_UNKNOWN = 1;
  LOGIN_STATE_LOGGED_IN = 2;
  LOGIN_STATE_LOGGED_OUT = 3;
}

message HarnessAccount {
  // "claude". Later "codex".
  string harness = 1;
  string display_name = 2;
  AuthMethod auth_method = 3;
  bool api_key_set = 4;
  // Subscription login as last reported by one of the user's environments.
  LoginState login_state = 5;
  google.protobuf.Timestamp login_checked_at = 6;
}

message SecretInfo {
  string name = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  repeated HarnessAccount accounts = 1;
  repeated SecretInfo secrets = 2;
}

message SetAuthMethodRequest {
  string harness = 1;
  AuthMethod auth_method = 2;
  // Required when switching to API_KEY and none is stored yet.
  string api_key = 3;
}

message SetAuthMethodResponse {}

message SetSecretRequest {
  // An environment variable name: [A-Z_][A-Z0-9_]*.
  string name = 1;
  string value = 2;
}

message SetSecretResponse {}

message DeleteSecretRequest {
  string name = 1;
}

message DeleteSecretResponse {}

enum LoginAction {
  LOGIN_ACTION_UNSPECIFIED = 0;
  LOGIN_ACTION_LOGIN = 1;
  LOGIN_ACTION_LOGOUT = 2;
}

message OpenLoginTerminalRequest {
  string harness = 1;
  LoginAction action = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message WriteLoginTerminalRequest {
  string harness = 1;
  bytes data = 2;
}

message ResizeLoginTerminalRequest {
  string harness = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// A one-line summary of a thread's latest notable event.
message TeamActivity {
  // User id, "agent" or "system", as in Event.
  string actor = 1;
  // E.g. "Edit src/x.ts", "errored: Setup failed: tools", a message's first line.
  string text = 2;
  google.protobuf.Timestamp time = 3;
}

message TeamWatchRequest {}

message TeamWatchResponse {
  // Threads updated in the last 7 days, not settled by their owners, most
  // recently updated first. Without diffs.
  repeated Thread threads = 1;
}

message InboxWatchRequest {}

message InboxWatchResponse {
  // As ListThreads and ListMentioned return them.
  repeated Thread threads = 1;
  repeated Thread mentioned = 2;
}

message InboxMarkReadRequest {
  string thread_id = 1;
}

message InboxMarkReadResponse {}

message WatchThreadRequest {
  string thread_id = 1;
  int64 after_seq = 2;
  // With after_seq 0: replay only the last `tail` stored events (0: all).
  int32 tail = 3;
}

message HistoryRequest {
  string thread_id = 1;
  // The newest `limit` events (at most 1000) with seq < before_seq, in seq order.
  int64 before_seq = 2;
  int32 limit = 3;
  // Don't cut large payloads.
  bool full = 4;
}

message HistoryResponse {
  repeated Event events = 1;
}

// The agent asks before running a tool call. Usually follows that call's
// ToolCall event.
message PermissionRequested {
  // Claude Code's request id; PermissionResolved and PermissionAnswer refer to it.
  string id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  // Redacted.
  string input_json = 4;
  // Why Claude Code asks, if it said.
  string reason = 5;
}

// The answer to a PermissionRequested, by the event's actor (a user, or
// "system" for CANCELED and LOST).
message PermissionResolved {
  string id = 1;
  PermissionDecision decision = 2;
  // The reason given with a denial.
  string message = 3;
  // A plan approval switched the thread to this mode.
  PermissionMode mode = 4;
}

message PermissionAnswerRequest {
  string thread_id = 1;
  string request_id = 2;
  // ALLOW, ALLOW_ALWAYS or DENY.
  PermissionDecision decision = 3;
  // Optional, for DENY: told to the agent.
  string message = 4;
  // Required to approve a plan: the mode to work in afterwards.
  PermissionMode mode = 5;
}

message PermissionAnswerResponse {}

message PermissionSetModeRequest {
  string thread_id = 1;
  PermissionMode mode = 2;
}

message PermissionSetModeResponse {}

message PermissionModeChanged {
  PermissionMode mode = 1;
}

message WatchThreadResponse {
  Event event = 1;
}

// Runner -> API.
message ConnectRequest {
  oneof kind {
    // First message on every connection.
    Hello hello = 1;
    // The agent can take prompts (checkout done, Claude Code logged in).
    Ready ready = 4;
    // Agent output. The API assigns seq and stores everything but deltas.
    Event event = 2;
    Diff diff = 3;
    TerminalOutput terminal_output = 5;
    FileResponse file_response = 6;
    // The harness login state, sent at start and whenever it changes.
    LoginStatus login_status = 7;
    HttpTunnel http_tunnel = 8;
    // The listening ports, sent at start and whenever they change.
    PreviewPorts preview_ports = 9;
    // Answers a Ping.
    Pong pong = 10;
    // The result of a Push before a suspend, whether or not it changed.
    AutoPush pushed = 15;
  }
}

// The API asks a connected runner whether it still answers before letting
// another connection with the same token replace it.
message Ping {}

message Pong {}

message Hello {
  // Set by thread environments.
  string thread_id = 1;
  string token = 2;
  // Set instead of thread_id by a user's login environment.
  string login_user_id = 3;
}

message LoginStatus {
  string harness = 1;
  bool logged_in = 2;
}

message Ready {}

message TerminalOutput {
  bytes data = 1;
  bool exited = 2;
}

message Diff {
  string diff = 1;
}

// The answer to a FileRequest.
message FileResponse {
  string request_id = 1;
  repeated string paths = 2;
  bool truncated = 3;
  string content = 4;
  bool binary = 5;
  // Set if the request failed.
  string error = 6;
}

// API -> runner.
message ConnectResponse {
  oneof kind {
    Prompt prompt = 1;
    Stop stop = 2;
    Push push = 3;
    TerminalOpen terminal_open = 4;
    TerminalInput terminal_input = 5;
    TerminalResize terminal_resize = 6;
    TerminalClose terminal_close = 7;
    FileRequest file_request = 8;
    // Sent on connect and on every change. The runner restarts the agent with
    // them when no turn is running.
    AgentSettings agent_settings = 9;
    HttpTunnel http_tunnel = 11;
    PermissionCommand permission = 14;
    Ping ping = 15;
  }
}

// Answers a pending permission request (request_id set), or else configures
// the agent: sent when the runner is ready and whenever the owner changes
// the mode or always allows a tool.
message PermissionCommand {
  string request_id = 1;
  PermissionDecision decision = 2;
  string message = 3;
  // The mode to run in from now on. Unset with an answer: keep it.
  PermissionMode mode = 4;
  // Tools the runner allows without asking.
  repeated string allowed_tools = 5;
}

message Prompt {
  string text = 1;
  // Images referenced in the text, in order, sent as image content blocks.
  repeated AttachmentImage images = 2;
}

message AttachmentImage {
  string media_type = 1;
  bytes data = 2;
}

// Interrupts the current turn.
message Stop {}

// Push the thread branch and report the result as a notice.
message Push {
  // Before the environment is suspended: once the push before (if any) is
  // done, push again and answer with ConnectRequest.pushed, so the API knows
  // whether all work is on origin, terminal commits and edits included.
  bool suspend = 1;
}

message TerminalOpen {
  uint32 cols = 1;
  uint32 rows = 2;
  string command = 3;
}

message TerminalInput {
  bytes data = 1;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalClose {}

// Lists the checkout's files, or reads `path` from it.
message FileRequest {
  string request_id = 1;
  string path = 2;
  bool list = 3;
}

// One message of a TCP connection relayed between the API's preview proxy and
// a port in the sandbox, in either direction. The API opens it with `port`.
// Flow control: a side sends at most 8 data messages that the other has not
// acknowledged yet.
message HttpTunnel {
  string id = 1;
  uint32 port = 2;
  bytes data = 3;
  // How many of the peer's data messages were consumed.
  uint32 ack = 4;
  // The connection ended; `error` says why, if it failed.
  bool close = 5;
  string error = 6;
}

message PreviewPorts {
  repeated PreviewPort ports = 1;
}

// One thread of a Race or Fork; empty fields keep the default (or the
// forked thread's) model and effort.
message RaceTry {
  string model = 1;
  string effort = 2;
}

message ForkRequest {
  string thread_id = 1;
  // Optional new instruction. Without one the fork sums up where things stand.
  string prompt = 2;
  // Empty: one fork with the source's model and effort. At most 4.
  repeated RaceTry tries = 3;
}

message ForkResponse {
  repeated Thread threads = 1;
}

message RaceRequest {
  string repo_url = 1;
  string base_branch = 2;
  string prompt = 3;
  // 2 to 4.
  repeated RaceTry tries = 4;
  // Every try's; unspecified: bypass.
  PermissionMode permission_mode = 5;
}

message RaceResponse {
  repeated Thread threads = 1;
}

message RaceCompareRequest {
  // The threads of a race, and/or any threads by id.
  string race_id = 1;
  repeated string thread_ids = 2;
}

message RaceCompareResponse {
  repeated RaceEntry entries = 1;
}

message RaceEntry {
  Thread thread = 1;
  // Totals over the thread's finished turns.
  int32 turns = 2;
  double cost_usd = 3;
  int64 duration_ms = 4;
}

message RacePickRequest {
  string thread_id = 1;
}

message RacePickResponse {}

message ForkPatchRequest {
  string thread_id = 1;
  string token = 2;
}

message ForkPatchResponse {
  // Empty if the thread is not a fork. A unified diff (git apply).
  string patch = 1;
  // The commit message for it.
  string message = 2;
}

enum SearchKind {
  SEARCH_KIND_UNSPECIFIED = 0;
  // Messages and turn requests by people (and agents posting through MCP).
  SEARCH_KIND_PEOPLE = 1;
  // The agent's text.
  SEARCH_KIND_AGENT = 2;
  // Tool calls and review comments.
  SEARCH_KIND_CODE = 3;
}

message SearchRequest {
  // Words, all of which must match, each also as a prefix ("auth" finds
  // "authentication").
  string query = 1;
  // Filters; empty or unset means any.
  string actor = 2;
  string repo_url = 3;
  SearchKind kind = 4;
  google.protobuf.Timestamp after = 5;
  google.protobuf.Timestamp before = 6;
  // At most 100; 0 means 20.
  int32 limit = 7;
}

message SearchResult {
  string thread_id = 1;
  string thread_title = 2;
  string repo_url = 3;
  // The matching event; the thread page scrolls to it at /t/<id>#<seq>.
  int64 seq = 4;
  string actor = 5;
  google.protobuf.Timestamp time = 6;
  SearchKind kind = 7;
  // The matching passage in parts: odd parts are the matched words.
  repeated string snippet = 8;
}

message SearchResponse {
  repeated SearchResult results = 1;
}
