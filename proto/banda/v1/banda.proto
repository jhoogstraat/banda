syntax = "proto3";

package banda.v1;

import "google/protobuf/timestamp.proto";

// ThreadService is the API the web client talks to.
// Its server streams, and SettingsService's, send a keepalive every 25 s so
// proxies with read timeouts don't cut a quiet stream; clients skip them.
service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc SetMode(SetModeRequest) returns (SetModeResponse);
  // Changes the agent's model, effort and profile (owner only). A running
  // agent restarts with them once its turns have ended; a paused one starts
  // with them.
  rpc SetAgentSettings(SetAgentSettingsRequest) returns (SetAgentSettingsResponse);
  rpc Retry(RetryRequest) returns (RetryResponse);
  // Owner only: runs a teammate's turn request as their turn, or drops it.
  rpc ApproveTurn(ApproveTurnRequest) returns (ApproveTurnResponse);
  rpc DeclineTurn(DeclineTurnRequest) returns (DeclineTurnResponse);
  // Owner only: whether teammates can start turns without approval.
  rpc Trust(TrustRequest) returns (TrustResponse);
  // A sub-thread of parent_id, owned by the caller. It starts from the
  // parent's branch if that was pushed, else from the parent's base branch.
  rpc SpawnThread(SpawnThreadRequest) returns (SpawnThreadResponse);
  // The sub-threads of a thread, most recently active first.
  rpc LineageChildren(LineageChildrenRequest) returns (LineageChildrenResponse);
  // Replays stored events with seq > after_seq (or the last `tail`), then
  // streams live events. Large payloads are cut (Event.truncated).
  rpc WatchThread(WatchThreadRequest) returns (stream WatchThreadResponse);
  // Older stored events, for paging back from a tail, or one event in full.
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Other users' threads in which the caller is mentioned and hasn't answered.
  rpc ListMentioned(ListMentionedRequest) returns (ListMentionedResponse);
  // Per-viewer snooze; an unset `until` clears it. The owner snoozing also
  // suspends the environment.
  rpc Snooze(SnoozeRequest) returns (SnoozeResponse);
  // Per-viewer settle. The owner settling also suspends the environment.
  rpc Settle(SettleRequest) returns (SettleResponse);
  // Pushes the thread branch to origin (owner only). The result arrives as a
  // notice event.
  rpc Push(PushRequest) returns (PushResponse);
  // Provisions a fresh environment for a thread whose settled environment was
  // deleted, from its pushed branch (owner only).
  rpc EnvironmentRecreate(EnvironmentRecreateRequest) returns (EnvironmentRecreateResponse);
  // A terminal in the thread's environment (owner only). Output streams until
  // the process exits; opening again replaces the previous terminal.
  rpc OpenTerminal(OpenTerminalRequest) returns (stream OpenTerminalResponse);
  rpc WriteTerminal(WriteTerminalRequest) returns (WriteTerminalResponse);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse);
  // The tracked and unignored files of the thread's checkout, read from the
  // running environment. Fails while it is not running.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // The TCP ports listening in the thread's environment (everyone): the
  // current state, then every change. Never wakes a paused environment,
  // except for the owner with `wake` set.
  rpc PreviewWatch(PreviewWatchRequest) returns (stream PreviewWatchResponse);
  // A URL on the preview origin that shows what listens on `port`, through
  // the runner. Opening it signs the browser in to the preview origin.
  rpc PreviewOpen(PreviewOpenRequest) returns (PreviewOpenResponse);
  // The caller's sidebar: sent at once, then again whenever one of its
  // threads changes or the caller is mentioned somewhere new.
  rpc InboxWatch(InboxWatchRequest) returns (stream InboxWatchResponse);
  // Marks the thread read for the caller, up to its latest event.
  rpc InboxMarkRead(InboxMarkReadRequest) returns (InboxMarkReadResponse);
  // Tells the thread's watchers that the caller is typing. The composer calls
  // it every few seconds while typing; clients forget it after a few seconds.
  rpc SendTyping(TypingRequest) returns (TypingResponse);
  // Everyone's recent threads that their owners haven't settled, with their
  // last activity and who is looking at them: sent at once, then again
  // (coalesced) whenever one changes.
  rpc TeamWatch(TeamWatchRequest) returns (stream TeamWatchResponse);
  // What happened since the caller last saw the brief (BriefSeen), or in the
  // last day: teammates' finished turns, sub-threads, settled threads, and
  // what waits for the caller now.
  rpc Brief(BriefRequest) returns (BriefResponse);
  // Marks the brief seen up to its `until`.
  rpc BriefSeen(BriefSeenRequest) returns (BriefSeenResponse);
  // Answers the agent's pending permission request: the owner, or anyone in
  // a trusted thread. Approving a plan (ExitPlanMode) is for the owner only
  // and switches the thread to `mode`.
  rpc PermissionAnswer(PermissionAnswerRequest) returns (PermissionAnswerResponse);
  // Sets which tool calls the agent must ask for (owner only). Applies to the
  // running agent at once.
  rpc PermissionSetMode(PermissionSetModeRequest) returns (PermissionSetModeResponse);
  // Votes for answers to the agent's pending question (AskUserQuestion):
  // anyone, shown on the card for whoever answers. A new vote replaces the
  // caller's last one.
  rpc PermissionVote(PermissionVoteRequest) returns (PermissionVoteResponse);
  // Removes a tool or rule from the thread's "always allow" list: the owner,
  // or anyone in a trusted thread.
  rpc PermissionRevoke(PermissionRevokeRequest) returns (PermissionRevokeResponse);
  // Starts threads (one per try) from another thread's current changes and
  // conversation, owned by the caller. Anyone who can see a thread can fork it.
  rpc Fork(ForkRequest) returns (ForkResponse);
  // Starts sibling threads with the same prompt, one per try.
  rpc Race(RaceRequest) returns (RaceResponse);
  // Status, cost, time, latest reply and diff of threads, side by side.
  // NotFound when there are none.
  rpc RaceCompare(RaceCompareRequest) returns (RaceCompareResponse);
  // Everyone's most recent races, newest first: the threads of each, without
  // diffs.
  rpc RaceList(RaceListRequest) returns (RaceListResponse);
  // Keeps one thread of a race (owner only): settles its siblings for the
  // caller and notes the pick in each.
  rpc RacePick(RacePickRequest) returns (RacePickResponse);
  // Full-text search over every thread's messages, review comments, agent
  // text and tool calls, best matches first.
  rpc Search(SearchRequest) returns (SearchResponse);
  // Offers the thread to a teammate (owner only). If the agent is idle, it
  // first writes a briefing for them, as the owner's last turn. The next
  // turns run on the recipient's subscription once they accept.
  rpc HandoffOffer(HandoffOfferRequest) returns (HandoffOfferResponse);
  // Takes the offered thread (the recipient only): its environment restarts
  // with the recipient's Claude login and secrets, in a new Claude Code
  // session that gets the conversation so far. Refused while the agent works.
  rpc HandoffAccept(HandoffAcceptRequest) returns (HandoffAcceptResponse);
  // Withdraws the pending offer: declined by the recipient, or cancelled by
  // the owner.
  rpc HandoffDecline(HandoffDeclineRequest) returns (HandoffDeclineResponse);

  // The thread's pull request (GitLab: merge request) as last fetched from
  // its forge with the owner's token, for everyone; refresh fetches it now.
  rpc PullRequestGet(PullRequestGetRequest) returns (PullRequestGetResponse);
  // Opens a pull request for the thread's pushed branch against its base
  // (owner only, with the owner's token).
  rpc PullRequestCreate(PullRequestCreateRequest) returns (PullRequestCreateResponse);
  // Links an existing pull request: by number, or the open one whose head is
  // the thread's branch (owner only).
  rpc PullRequestLink(PullRequestLinkRequest) returns (PullRequestLinkResponse);
  // Edits the title or description, marks it draft or ready, requests
  // reviewers (owner only).
  rpc PullRequestUpdate(PullRequestUpdateRequest) returns (PullRequestUpdateResponse);
  // Merges it (owner only).
  rpc PullRequestMerge(PullRequestMergeRequest) returns (PullRequestMergeResponse);
  // Comments on it, or replies to a review comment, with the caller's own
  // token (refused without one).
  rpc PullRequestComment(PullRequestCommentRequest) returns (PullRequestCommentResponse);
  // The caller's repositories on the forges they have a token for, for the
  // new-thread composer.
  rpc ListForgeRepos(ListForgeReposRequest) returns (ListForgeReposResponse);
  // Who may be asked for a review and which labels exist on the thread's
  // repository, from its forge with the owner's token (owner only).
  rpc PullRequestChoices(PullRequestChoicesRequest) returns (PullRequestChoicesResponse);
  // Resolves or reopens a review thread, with the caller's own token
  // (refused without one).
  rpc PullRequestResolve(PullRequestResolveRequest) returns (PullRequestResolveResponse);
  // Gives a thread without a repository one (owner only, not while the agent
  // works): the environment restarts with the folder as a checkout of the
  // thread branch, its files kept as uncommitted changes. Until a checkout of
  // it succeeded, the repository can be changed, or removed (empty repo_url).
  rpc AddRepository(AddRepositoryRequest) returns (AddRepositoryResponse);
}

service UserService {
  rpc Me(MeRequest) returns (MeResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// SettingsService is the caller's own harness accounts and secrets, and the
// team's secrets. Secret and API key values are write-only: no RPC ever
// returns them.
service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Chooses how a harness signs in. Applies to environments started
  // afterwards. An API key, when given, replaces the stored one.
  rpc SetAuthMethod(SetAuthMethodRequest) returns (SetAuthMethodResponse);
  // Creates or replaces a secret, passed to all the caller's environments as
  // an environment variable. Reserved names (harness credentials) are refused.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // The profile of the caller's new threads that don't name one.
  rpc SetDefaultProfile(SetDefaultProfileRequest) returns (SetDefaultProfileResponse);
  // Team secrets go to every environment of every user, before their own
  // secrets, so a user's secret of the same name wins. Anyone signed in lists,
  // sets, replaces and deletes them; the same names are refused.
  rpc ListTeamSecrets(ListTeamSecretsRequest) returns (ListTeamSecretsResponse);
  rpc SetTeamSecret(SetTeamSecretRequest) returns (SetTeamSecretResponse);
  rpc DeleteTeamSecret(DeleteTeamSecretRequest) returns (DeleteTeamSecretResponse);
  // A terminal in the caller's login environment: a small pod that mounts
  // only the caller's harness config volume, started on demand. It runs the
  // harness's login or logout command. Output streams until it exits.
  rpc OpenLoginTerminal(OpenLoginTerminalRequest) returns (stream OpenTerminalResponse);
  rpc WriteLoginTerminal(WriteLoginTerminalRequest) returns (WriteTerminalResponse);
  rpc ResizeLoginTerminal(ResizeLoginTerminalRequest) returns (ResizeTerminalResponse);
  // The name and email of commits in the caller's environments; empty ones
  // fall back to their sign-in's. Applies to environments started afterwards.
  rpc SetGitIdentity(SetGitIdentityRequest) returns (SetGitIdentityResponse);
  // What the caller's new threads start with when they don't say.
  rpc SetThreadDefaults(SetThreadDefaultsRequest) returns (SetThreadDefaultsResponse);
  // Workload identity: Banda as an OIDC issuer of short-lived tokens naming
  // each thread's owner, for the audiences the team adds (none: off). Anyone
  // signed in lists, adds and removes audiences; running threads get the
  // change within seconds.
  rpc GetWorkloadIdentity(GetWorkloadIdentityRequest) returns (GetWorkloadIdentityResponse);
  rpc AddIdTokenAudience(AddIdTokenAudienceRequest) returns (AddIdTokenAudienceResponse);
  rpc RemoveIdTokenAudience(RemoveIdTokenAudienceRequest) returns (RemoveIdTokenAudienceResponse);
  // GitHub: the team's GitHub App (one per Banda, set up by anyone signed in)
  // and the caller's connection to it. Its keys and tokens stay in the API.
  rpc GetGitHub(GetGitHubRequest) returns (GetGitHubResponse);
  // A manifest for the browser to post to the forge, which creates the app and
  // returns to /github/app; see internal/api/github.go.
  rpc GitHubAppManifest(GitHubAppManifestRequest) returns (GitHubAppManifestResponse);
  // The accounts the app is installed on (asks the forge, cached for a minute).
  rpc ListGitHubInstallations(ListGitHubInstallationsRequest) returns (ListGitHubInstallationsResponse);
  // Banda forgets the app; it stays on the forge, where its owner deletes it.
  rpc RemoveGitHubApp(RemoveGitHubAppRequest) returns (RemoveGitHubAppResponse);
  // Revokes the caller's connection at the forge and forgets it.
  rpc DisconnectGitHub(DisconnectGitHubRequest) returns (DisconnectGitHubResponse);
  // GitLab: the team's OAuth application per GitLab host (made by hand on
  // GitLab, its ID and secret pasted here) and the caller's connections.
  rpc GetGitLab(GetGitLabRequest) returns (GetGitLabResponse);
  // Verifies the application's ID and secret with GitLab and keeps them.
  rpc SetGitLabApp(SetGitLabAppRequest) returns (SetGitLabAppResponse);
  // Banda forgets the application and everyone's connections through it.
  rpc RemoveGitLabApp(RemoveGitLabAppRequest) returns (RemoveGitLabAppResponse);
  // Revokes both of the caller's grants on the host at GitLab and forgets them.
  rpc DisconnectGitLab(DisconnectGitLabRequest) returns (DisconnectGitLabResponse);
}

// RunnerService is dialed by the runner inside each sandbox pod, so the API
// never has to reach into pods.
service RunnerService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  // The changes a fork starts from, applied once after the first checkout.
  rpc ForkPatch(ForkPatchRequest) returns (ForkPatchResponse);
  // Identity tokens for the thread's owner, one per audience of the team's.
  // Only for a connected thread runner; fetched again on IdTokensChanged.
  rpc IdTokens(IdTokensRequest) returns (IdTokensResponse);
  // A short-lived credential for git, for the thread's own repository only:
  // the GitHub App's installation token, as the owner may use it, or on GitLab
  // the owner's git-only OAuth token. Refused with
  // a reason a person can act on.
  rpc GitCredential(GitCredentialRequest) returns (GitCredentialResponse);
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_STARTING = 1;
  STATUS_WORKING = 2;
  STATUS_AWAITING_INPUT = 3;
  STATUS_ERRORED = 4;
  // Idle with the environment paused; the next prompt resumes it.
  STATUS_SUSPENDED = 5;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // Every owner message starts a turn.
  MODE_AGENT = 1;
  // Only messages that mention the agent start a turn.
  MODE_CHAT = 2;
}

message Thread {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  // Empty: the thread has no repository, and so no branches and no diff.
  string repo_url = 4;
  string branch = 5;
  string model = 6;
  string effort = 7;
  Status status = 8;
  Mode mode = 9;
  // Unified diff of the branch against its base, refreshed after each turn.
  string diff = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string base_branch = 13;
  // The caller's own view of the thread.
  google.protobuf.Timestamp snoozed_until = 14;
  bool settled = 15;
  // Teammate turn requests waiting for the owner's approval.
  int32 turn_requests = 18;
  // Teammates start turns without the owner's approval.
  bool trusted = 19;
  // The thread has events the caller hasn't seen (see InboxMarkRead).
  bool unread = 16;
  // The latest thing that happened, for passers-by. Set in lists only.
  TeamActivity activity = 20;
  // Users with the thread open right now. Set by TeamWatch only.
  repeated string present_user_ids = 21;
  // Where the thread's work lives, as the runner last reported it.
  AutoPushState auto_push = 22;
  // The settled environment and its volume were deleted; the branch is on
  // origin (see EnvironmentRecreate).
  bool environment_deleted = 23;
  PermissionMode permission_mode = 24;
  // The agent waits for an answer to a permission request.
  bool permission_pending = 25;
  // Set if the thread was forked from another one.
  ForkOrigin forked_from = 28;
  // Shared by the threads started together by one Race or Fork.
  string race_id = 29;
  // The thread this one was spawned from, if any.
  string parent_id = 26;
  string parent_title = 27;
  // A GitHub pull request for the branch, once it is pushed.
  string pull_request_url = 30;
  // Who the agent works with, see AgentSettings.
  string profile = 31;
  // Other recent, unsettled threads on the same repository and base branch
  // whose diffs change some of the same files. Set by GetThread and TeamWatch.
  repeated Overlap overlaps = 32;
  // The tools the pending permission requests are for, sorted ("ExitPlanMode"
  // for a plan).
  repeated string permission_tools = 33;
  // Tools and rules the agent uses without asking, e.g. "Bash" or
  // "Bash(npm test:*)" (see PermissionAnswerRequest.rule).
  repeated string allowed_tools = 34;
  // The teammate the owner offered the thread to, until they accept or
  // decline (see HandoffOffer).
  string handoff_to = 35;
  // The linked pull request (GitLab: merge request), as last fetched.
  PullRequestSummary pull_request = 36;
  // The forge of the repository: "github", "gitlab", or empty when Banda
  // doesn't know it (see FORGE_HOSTS).
  string forge = 37;
  // The owner has a token for the forge, so Banda can open and manage the
  // pull request. Set by GetThread only.
  bool forge_ready = 38;
  // The owner runs Claude Code on an API key, so teammates may request turns
  // and be trusted. On a subscription only the owner runs the agent.
  bool teammate_turns = 39;
  // While starting: what Kubernetes says its pod waits on, as EnvWaiting. In
  // ListThreads, ListMentioned and TeamWatch; never stored.
  string env_waiting = 40;
}

// Another thread that changes some of the same files (see Thread.overlaps).
message Overlap {
  string thread_id = 1;
  string title = 2;
  string owner_id = 3;
  // Not set in an Event.
  Status status = 4;
  // The files both diffs change, sorted.
  repeated string paths = 5;
}

// Which tool calls the agent asks for, mapped to Claude Code's
// --permission-mode. Requests arrive as PermissionRequested events.
enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  // Nothing asks (bypassPermissions): the sandbox is the boundary.
  PERMISSION_MODE_BYPASS = 1;
  // Reads run, edits and commands ask (default).
  PERMISSION_MODE_ASK = 2;
  // Reads and edits run, other commands ask (acceptEdits).
  PERMISSION_MODE_ACCEPT_EDITS = 3;
  // Read-only planning until the owner approves the plan (plan).
  PERMISSION_MODE_PLAN = 4;
}

enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  PERMISSION_DECISION_ALLOW = 1;
  // Allow, and allow this tool without asking for the rest of the thread.
  PERMISSION_DECISION_ALLOW_ALWAYS = 2;
  PERMISSION_DECISION_DENY = 3;
  // The agent withdrew the request, e.g. the turn was interrupted.
  PERMISSION_DECISION_CANCELED = 4;
  // The environment restarted before an answer; that turn is gone.
  PERMISSION_DECISION_LOST = 5;
}

message ForkOrigin {
  string thread_id = 1;
  // Turns the source thread had finished when it was forked.
  int32 turn = 2;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message Event {
  string thread_id = 1;
  // Order within the thread. 0 for ephemeral events that are not stored.
  int64 seq = 2;
  google.protobuf.Timestamp time = 3;
  // User id, "agent" or "system".
  string actor = 4;
  // Sent before a tail for its context, not in seq order: the latest plan
  // (PlanChanged) and the latest slash commands (SlashCommands) from before
  // the tail. Not part of the chat.
  bool context = 5;
  // A large payload (a tool call's input strings, a tool result's output) was
  // cut to a few KB. History with full loads the whole event.
  bool truncated = 6;
  oneof kind {
    Message message = 10;
    AgentText agent_text = 11;
    AgentTextDelta agent_text_delta = 12;
    AgentThinking agent_thinking = 13;
    ToolCall tool_call = 14;
    ToolResult tool_result = 15;
    TurnEnded turn_ended = 16;
    StatusChanged status_changed = 17;
    ModeChanged mode_changed = 18;
    DiffChanged diff_changed = 19;
    Notice notice = 20;
    SetupStep setup_step = 21;
    TurnRequest turn_request = 24;
    TurnRequestResolved turn_request_resolved = 25;
    // Ephemeral (seq 0): who is watching the thread.
    PresenceChanged presence_changed = 22;
    // Ephemeral (seq 0): the actor is typing in the composer.
    Typing typing = 23;
    // The owner changed the model or effort (both set), the profile (set
    // when it changed) or both; actor is the owner.
    AgentSettings agent_settings = 26;
    // Where the work lives changed, e.g. after an auto-push.
    AutoPush auto_push = 29;
    PermissionRequested permission_requested = 30;
    PermissionResolved permission_resolved = 31;
    // Links another thread: a fork of this one, or the pick of a race.
    ForkNote fork_note = 33;
    LineageUpdate lineage_update = 32;
    // The permission mode changed: by the owner, or by the agent entering
    // plan mode itself (EnterPlanMode; actor "agent").
    PermissionModeChanged permission_mode_changed = 34;
    // The thread now changes files that another one changes too, or more of
    // them than it was told before.
    Overlap overlap = 35;
    PermissionVoted permission_voted = 36;
    // Someone removed an "always allow" tool or rule.
    PermissionRevoked permission_revoked = 37;
    // The owner offered the thread to a teammate; actor is the owner.
    HandoffOffered handoff_offered = 38;
    // The offer at offer_seq was accepted or declined (actor: the recipient)
    // or cancelled (actor: the owner).
    HandoffResolved handoff_resolved = 39;
    // A port started listening in the environment (see PreviewWatch); the
    // ports already listening when a runner connects aren't announced.
    PreviewPort port_opened = 40;
    // The pull request was opened or linked, or changed notably (checks
    // failed or passed, a review, merged, closed). Ephemeral (seq 0, change
    // empty) for any other change, so open pages refetch it.
    PullRequestChanged pull_request_changed = 41;
    // The owner (actor) gave the thread without a repository one, changed it
    // before its first checkout, or removed it (repo_url empty).
    RepoAdded repo_added = 42;
    // The agent's task list changed (TaskCreate, TaskUpdate): the whole list.
    // Not part of the chat; the latest is the plan pinned above the composer.
    PlanChanged plan_changed = 50;
    // Ephemeral (seq 0): a request to Anthropic failed (overloaded, rate
    // limited, a server or network error) and Claude Code retries it.
    // Agent output that follows means the retry worked.
    AgentRetrying agent_retrying = 51;
    // What Claude Code offers as slash commands (its own, the repo's and the
    // user's commands and skills), sent at each start. Not part of the chat;
    // the latest is offered in the owner's composer.
    SlashCommands slash_commands = 52;
    // Ephemeral (seq 0), every few seconds while the environment is starting
    // and Kubernetes says why its pod isn't up: unschedulable, an image
    // pull that fails and is retried. A status change ends it.
    EnvWaiting env_waiting = 53;
  }
}

message EnvWaiting {
  // In Banda's words with Kubernetes' message, e.g. "Waiting for room on a
  // node: 0/1 nodes are available: …". Empty: nothing in the way any more.
  string reason = 1;
}

message SlashCommands {
  repeated SlashCommand commands = 1;
}

message SlashCommand {
  // Without the slash: "compact", "review".
  string name = 1;
  string description = 2;
  // What goes after the name, e.g. "<file>"; empty if nothing does.
  string argument_hint = 3;
}

message AgentRetrying {
  int32 attempt = 1;
  int32 max_retries = 2;
  // The CLI's category: "overloaded", "rate_limit", "server_error", ...
  string error = 3;
  // The HTTP status, 0 without a response.
  int32 error_status = 4;
}

message PlanChanged {
  repeated PlanItem items = 1;
}

message PlanItem {
  string content = 1;
  // "pending", "in_progress" or "completed".
  string status = 2;
  // Present tense, shown while in progress: "Running the tests".
  string active_form = 3;
}

message ForkNote {
  // The fork, or the thread picked in the race.
  string thread_id = 1;
  string title = 2;
  // false: `thread_id` was forked from this thread after `turn` turns.
  // true: the actor picked `thread_id` (maybe this thread) in its race.
  bool picked = 3;
  int32 turn = 4;
}

message Message {
  string text = 1;
  bool mentions_agent = 2;
  repeated string mentioned_user_ids = 3;
  // Comments on the thread's diff, posted together as one review. `text` is
  // then an optional summary.
  repeated ReviewComment review = 4;
  // Files uploaded with POST /files and posted with the message. The API
  // fills in name, media type and size from the upload.
  repeated Attachment attachments = 6;
}

// A comment on a line range of the diff.
message ReviewComment {
  string path = 1;
  // Line numbers in the branch's version of the file, or in the base version
  // when `old` is set (the range has only removed lines).
  int32 start_line = 2;
  int32 end_line = 3;
  bool old = 4;
  // The commented diff lines, with their +/-/space prefixes.
  string code = 5;
  string body = 6;
}

// An image or small text file, served at GET /files/<id>. Images reach the
// agent as image blocks, text files inlined in the prompt.
message Attachment {
  string id = 1;
  string name = 2;
  // image/png, image/jpeg, image/gif, image/webp, or text/plain.
  string media_type = 3;
  int64 size = 4;
}

// A teammate's message to the agent, waiting for the owner's approval
// (instead of a Message event). The actor is the teammate.
message TurnRequest {
  Message message = 1;
}

// The owner approved or declined the TurnRequest event at request_seq.
message TurnRequestResolved {
  int64 request_seq = 1;
  bool approved = 2;
  string note = 3;
}

// In a parent thread: a sub-thread was spawned (status STARTING), finished a
// turn (AWAITING_INPUT, text is the first line of its last agent text) or
// failed (ERRORED, text is why).
message LineageUpdate {
  string thread_id = 1;
  string title = 2;
  Status status = 3;
  string text = 4;
}

message AgentText {
  string text = 1;
}

// Ephemeral streaming chunk of the agent text that is being written.
message AgentTextDelta {
  string text = 1;
}

message AgentThinking {
  string text = 1;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string input_json = 3;
